    <!-- Cloud Firestore Real-Time Bridge (Firebase v11 Modular SDK) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.DTA_CLOUD = {
            ready: false,
            user: null,
            db: null,
            appId: typeof __app_id !== 'undefined' ? __app_id : 'descriptive-text-adventure',
            async init() {
                try {
                    if (typeof __firebase_config === 'undefined' || !__firebase_config) return false;
                    const cfg = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
                    const app = initializeApp(cfg);
                    const auth = getAuth(app);
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    this.user = auth.currentUser;
                    this.db = getFirestore(app);
                    this.ready = !!(this.user && this.db);
                    return this.ready;
                } catch (err) {
                    console.warn("Cloud Firestore fallback mode:", err);
                    return false;
                }
            },
            async upsertPeer(roomCode, peerProfile) {
                if (!this.ready || !this.user || !this.db || !peerProfile?.id) return;
                try {
                    const docId = `${roomCode}_${peerProfile.id}`;
                    const ref = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'dta_room_peers', docId);
                    await setDoc(ref, { ...peerProfile, roomCode, updatedAt: Date.now() }, { merge: true });
                } catch (e) {}
            },
            async removePeer(roomCode, peerId) {
                if (!this.ready || !this.user || !this.db || !peerId) return;
                try {
                    const docId = `${roomCode}_${peerId}`;
                    const ref = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'dta_room_peers', docId);
                    await deleteDoc(ref);
                } catch (e) {}
            },
            async publishEvent(roomCode, envelope) {
                if (!this.ready || !this.user || !this.db || !envelope?.msgId) return;
                try {
                    const ref = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'dta_room_events', envelope.msgId);
                    await setDoc(ref, { ...envelope, roomCode, createdAt: Date.now() });
                } catch (e) {}
            },
            async upsertFocus(roomCode, focusState) {
                if (!this.ready || !this.user || !this.db) return;
                try {
                    const ref = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'dta_room_focus', roomCode);
                    await setDoc(ref, { ...focusState, roomCode, updatedAt: Date.now() }, { merge: true });
                } catch (e) {}
            },
            subscribeRoom(roomCode, onPeersChange, onEvent, onFocusChange) {
                if (!this.ready || !this.user || !this.db) return () => {};
                const peersCol = collection(this.db, 'artifacts', this.appId, 'public', 'data', 'dta_room_peers');
                const eventsCol = collection(this.db, 'artifacts', this.appId, 'public', 'data', 'dta_room_events');
                const focusRef = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'dta_room_focus', roomCode);

                const unsubPeers = onSnapshot(peersCol, (snap) => {
                    const list = [];
                    const now = Date.now();
                    snap.forEach((d) => {
                        const val = d.data();
                        if (val && val.roomCode === roomCode && !val.offline && (!val.updatedAt || now - val.updatedAt < 45000)) {
                            list.push(val);
                        }
                    });
                    onPeersChange(list);
                }, (err) => console.warn("Firestore peers listener:", err));

                const unsubEvents = onSnapshot(eventsCol, (snap) => {
                    snap.docChanges().forEach((change) => {
                        if (change.type === 'added') {
                            const ev = change.doc.data();
                            if (ev && ev.roomCode === roomCode && (!ev.createdAt || Date.now() - ev.createdAt < 45000)) {
                                onEvent(ev);
                            }
                        }
                    });
                }, (err) => console.warn("Firestore events listener:", err));

                const unsubFocus = onSnapshot(focusRef, (snap) => {
                    if (snap.exists() && typeof onFocusChange === 'function') {
                        onFocusChange(snap.data());
                    }
                }, (err) => console.warn("Firestore focus listener:", err));

                return () => {
                    try { unsubPeers(); } catch (e) {}
                    try { unsubEvents(); } catch (e) {}
                    try { unsubFocus(); } catch (e) {}
                };
            }
        };
    </script>

        const TopAudioBar = ({ isPlaying, volume, onToggle, onVolumeChange, isPseudoFs = false, onTogglePseudoFs = null }) => {
            const [isNativeFs, setIsNativeFs] = useState(false);

            useEffect(() => {
                const syncFs = () => {
                    const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
                    setIsNativeFs(!!fsEl);
                };
                document.addEventListener('fullscreenchange', syncFs);
                document.addEventListener('webkitfullscreenchange', syncFs);
                document.addEventListener('mozfullscreenchange', syncFs);
                document.addEventListener('MSFullscreenChange', syncFs);
                return () => {
                    document.removeEventListener('fullscreenchange', syncFs);
                    document.removeEventListener('webkitfullscreenchange', syncFs);
                    document.removeEventListener('mozfullscreenchange', syncFs);
                    document.removeEventListener('MSFullscreenChange', syncFs);
                };
            }, []);

            const isFullscreen = isNativeFs || isPseudoFs;

            const toggleFullscreen = async (e) => {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
                if (isPseudoFs && !fsEl) {
                    if (onTogglePseudoFs) onTogglePseudoFs(false);
                    return;
                }
                try {
                    if (!fsEl) {
                        const docEl = document.documentElement || document.body;
                        const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
                        if (req) {
                            await Promise.resolve(req.call(docEl));
                            const nowFs = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
                            if (!nowFs && onTogglePseudoFs) onTogglePseudoFs(true);
                        } else if (onTogglePseudoFs) {
                            onTogglePseudoFs(true);
                        }
                    } else {
                        const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                        if (exit) await Promise.resolve(exit.call(document));
                        if (onTogglePseudoFs) onTogglePseudoFs(false);
                    }
                } catch (err) {
                    console.warn("Native fullscreen unavailable, using immersive fullscreen:", err);
                    if (onTogglePseudoFs) onTogglePseudoFs(!isPseudoFs);
                }
            };

        // =========================================================================
        // 7. MAIN APP COMPONENT
        // =========================================================================
        const App = () => {

            const [focusMode, setFocusMode] = useState(() => !!initialSession?.focusMode);
            const [liveActivityBanner, setLiveActivityBanner] = useState(null);
            const [syncedState, setSyncedState] = useState({

            // --- Walkie-Talkie & Mic States ---

            const [activeSpeaker, setActiveSpeaker] = useState(null);

            // --- Lofi Study Music States ---
            const [lofiPlaying, setLofiPlaying] = useState(false);
            const [lofiVolume, setLofiVolume] = useState(0.35);

            // --- Refs for Stable Callbacks ---
            const userRef = useRef(user);
            const progressRef = useRef(progress);
            const screenRef = useRef(screen);
            const activeWorldRef = useRef(activeWorld);
            const focusModeRef = useRef(focusMode);
            const peersRef = useRef(peers);

            useEffect(() => { userRef.current = user; }, [user]);
            useEffect(() => { progressRef.current = progress; }, [progress]);
            useEffect(() => { screenRef.current = screen; }, [screen]);
            useEffect(() => { activeWorldRef.current = activeWorld; }, [activeWorld]);
            useEffect(() => { focusModeRef.current = focusMode; }, [focusMode]);
            useEffect(() => { peersRef.current = peers; }, [peers]);
            useEffect(() => { voiceMutedRef.current = voiceMuted; }, [voiceMuted]);

            // Network transport refs
            const mqttClientRef = useRef(null);
            const peerJsRef = useRef(null);
            const peerConnsRef = useRef({});
            const bcRef = useRef(null);
            const sseRef = useRef(null);
            const seenMsgIdsRef = useRef(new Set());
            const transportsSetRef = useRef(new Set());

            // Audio & Mic refs
            const lofiAudioRef = useRef(null);
            const synthCtxRef = useRef(null);
            const synthTimerRef = useRef(null);
            const mediaRecorderRef = useRef(null);
            const mediaStreamRef = useRef(null);
            const audioChunksRef = useRef([]);
            const bannerTimerRef = useRef(null);
            const micTestTimerRef = useRef(null);
            const micTestStreamRef = useRef(null);
            const micTestCtxRef = useRef(null);
            const micTestIntervalRef = useRef(null);

            const isInRoom = Boolean(user.name && user.roomCode && !['home', 'identity'].includes(screen));

            // Save active session per-tab in sessionStorage
            useEffect(() => {
                if (user.name && !['home', 'identity'].includes(screen)) {
                    try {
                        sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
                            selfId,

            const markTransportActive = useCallback((name) => {
                transportsSetRef.current.add(name);

                setConnectionStatus('connected');
            }, []);

            const showLiveBanner = useCallback((text) => {

            const showModal = (title, message, type = 'info', onClose = null) => {
                setModal({ show: true, title, message, type, onClose });
            };

            const closeModal = () => {
                const cb = modal.onClose;
                setModal({ show: false, title: '', message: '', type: 'info', onClose: null });
                if (cb) cb();
            };

            // =========================================================================
            // LOFI STUDY MUSIC ENGINE (PIXABAY MP3 + HARMONIOUS WEB AUDIO FALLBACK)
            // =========================================================================
            const stopSynthFallback = useCallback(() => {
                if (synthTimerRef.current) {
                    clearInterval(synthTimerRef.current);
                    synthTimerRef.current = null;
                }
                if (synthCtxRef.current) {
                    try { synthCtxRef.current.close(); } catch (e) {}
                    synthCtxRef.current = null;
                }
            }, []);

            const startSynthFallback = useCallback((vol) => {
                try {
                    stopSynthFallback();
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;
                    const ctx = new AudioCtx();
                    synthCtxRef.current = ctx;

                    const chords = [
                        [261.63, 329.63, 392.00, 493.88], // Cmaj7
                        [220.00, 261.63, 329.63, 392.00], // Am7
                        [174.61, 220.00, 261.63, 329.63], // Fmaj7
                        [196.00, 246.94, 293.66, 349.23]  // G7
                    ];
                    let chordIdx = 0;

                    const playChord = () => {
                        if (!synthCtxRef.current) return;
                        const now = ctx.currentTime;
                        const notes = chords[chordIdx % chords.length];
                        chordIdx++;
                        notes.forEach((freq) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(freq, now);
                            gain.gain.setValueAtTime(0.0001, now);
                            gain.gain.exponentialRampToValueAtTime(Math.max(0.005, vol * 0.045), now + 0.6);
                            gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.4);
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.start(now);
                            osc.stop(now + 3.5);
                        });
                    };

                    playChord();
                    synthTimerRef.current = setInterval(playChord, 3500);
                } catch (e) {}
            }, [stopSynthFallback]);

            const toggleLofi = useCallback(() => {
                if (lofiPlaying) {
                    if (lofiAudioRef.current) {
                        lofiAudioRef.current.pause();
                    }
                    stopSynthFallback();
                    setLofiPlaying(false);
                } else {
                    try {
                        if (!lofiAudioRef.current) {
                            const audio = new Audio(LOFI_TRACKS[0]);
                            audio.loop = true;
                            audio.crossOrigin = 'anonymous';
                            audio.volume = lofiVolume;
                            audio.onerror = () => {
                                if (audio.src !== LOFI_TRACKS[1]) {
                                    audio.src = LOFI_TRACKS[1];
                                    audio.play().catch(() => startSynthFallback(lofiVolume));
                                } else {
                                    startSynthFallback(lofiVolume);
                                }
                            };
                            lofiAudioRef.current = audio;
                        }
                        lofiAudioRef.current.volume = lofiVolume;
                        const playPromise = lofiAudioRef.current.play();
                        if (playPromise && typeof playPromise.catch === 'function') {
                            playPromise.catch(() => startSynthFallback(lofiVolume));
                        }
                        setLofiPlaying(true);
                    } catch (e) {
                        startSynthFallback(lofiVolume);
                        setLofiPlaying(true);
                    }
                }
            }, [lofiPlaying, lofiVolume, startSynthFallback, stopSynthFallback]);

            const changeLofiVolume = useCallback((newVol) => {
                setLofiVolume(newVol);
                if (lofiAudioRef.current) {
                    lofiAudioRef.current.volume = newVol;
                }
            }, []);

            useEffect(() => {
                return () => {
                    if (lofiAudioRef.current) lofiAudioRef.current.pause();
                    stopSynthFallback();
                };
            }, [stopSynthFallback]);

            // =========================================================================
            // MULTIPLAYER BROADCAST & REAL-TIME SYNC ENGINE
            // =========================================================================
            const buildSelfProfile = useCallback(() => ({
                id: selfId,
                name: userRef.current.name || 'Detective',
                class: userRef.current.class || 'VII',
                groupName: userRef.current.groupName || '',
                role: userRef.current.role || 'student',
                avatar: userRef.current.avatar || '🕵️‍♂️',
                points: progressRef.current.points || 0,
                stars: progressRef.current.stars || 0,
                screen: screenRef.current,
                activeWorld: activeWorldRef.current,
                focusMode: userRef.current.role === 'teacher' ? focusModeRef.current : undefined,
                lastSeen: Date.now()
            }), [selfId]);

            const publishRetainedPresence = useCallback((profileOverride = null) => {
                const roomCode = normalizeRoomCode(userRef.current.roomCode);
                if (!userRef.current.name) return;
                const prof = profileOverride || buildSelfProfile();

                if (mqttClientRef.current && mqttClientRef.current.connected) {
                    try {
                        mqttClientRef.current.publish(
                            `dta_v4/${roomCode}/presence/${selfId}`,
                            JSON.stringify(prof),
                            { retain: true, qos: 0 }
                        );
                    } catch (e) {}
                }
                if (window.DTA_CLOUD && window.DTA_CLOUD.ready) {
                    window.DTA_CLOUD.upsertPeer(roomCode, prof);
                }
            }, [selfId, buildSelfProfile]);

            const publishRetainedFocus = useCallback((enabled, targetScreen, targetWorld) => {
                const roomCode = normalizeRoomCode(userRef.current.roomCode);
                const focusData = {
                    enabled: !!enabled,
                    screen: targetScreen,
                    activeWorld: targetWorld,
                    teacherName: userRef.current.name || 'Teacher',
                    updatedAt: Date.now()
                };
                if (mqttClientRef.current && mqttClientRef.current.connected) {
                    try {
                        mqttClientRef.current.publish(
                            `dta_v4/${roomCode}/focus`,
                            JSON.stringify(focusData),
                            { retain: true, qos: 0 }
                        );
                    } catch (e) {}
                }
                if (window.DTA_CLOUD && window.DTA_CLOUD.ready) {
                    window.DTA_CLOUD.upsertFocus(roomCode, focusData);
                }
            }, []);

            const broadcastEvent = useCallback((type, payload = {}) => {
                const roomCode = normalizeRoomCode(userRef.current.roomCode);
                if (!userRef.current.name) return;

                const envelope = {
                    msgId: `${selfId}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
                    type,
                    senderId: selfId,
                    senderName: userRef.current.name,
                    role: userRef.current.role || 'student',
                    avatar: userRef.current.avatar || '🕵️‍♂️',
                    roomCode,
                    payload,
                    ts: Date.now()
                };
                seenMsgIdsRef.current.add(envelope.msgId);

                // 1. MQTT WebSockets
                if (mqttClientRef.current && mqttClientRef.current.connected) {
                    try {
                        mqttClientRef.current.publish(`dta_v4/${roomCode}/events`, JSON.stringify(envelope));
                    } catch (e) {}
                }

                // 2. PeerJS WebRTC
                Object.values(peerConnsRef.current).forEach((conn) => {
                    if (conn && conn.open) {
                        try { conn.send(envelope); } catch (e) {}
                    }
                });

                // 3. Cloud Firestore
                if (window.DTA_CLOUD && window.DTA_CLOUD.ready && type !== 'VOICE_AUDIO') {
                    window.DTA_CLOUD.publishEvent(roomCode, envelope);
                }

                // 4. Port 443 HTTPS Relay (ntfy.sh) for lightweight events
                if (type !== 'VOICE_AUDIO' && JSON.stringify(envelope).length < 3600) {
                    try {
                        fetch(`${NTFY_BASE}/dta_room_v4_${roomCode.toLowerCase()}`, {
                            method: 'POST',
                            body: JSON.stringify(envelope)
                        }).catch(() => {});
                    } catch (e) {}
                }

                // 5. Same-device tabs via BroadcastChannel & localStorage
                if (bcRef.current) {
                    try { bcRef.current.postMessage(envelope); } catch (e) {}
                }
                if (type !== 'VOICE_AUDIO') {
                    try {
                        localStorage.setItem(`dta_ls_bus_${roomCode}`, JSON.stringify(envelope));
                    } catch (e) {}
                }
            }, [selfId]);

            const handleIncomingMessage = useCallback((msg) => {
                if (!msg || !msg.type || !msg.msgId) return;
                if (msg.senderId === selfId) return;
                if (seenMsgIdsRef.current.has(msg.msgId)) return;
                seenMsgIdsRef.current.add(msg.msgId);
                if (seenMsgIdsRef.current.size > 400) {
                    const arr = Array.from(seenMsgIdsRef.current).slice(-200);
                    seenMsgIdsRef.current = new Set(arr);
                }

                switch (msg.type) {
                    case 'WHO_IS_HERE': {
                        if (msg.payload?.profile) {
                            setPeers(prev => ({ ...prev, [msg.payload.profile.id]: msg.payload.profile }));
                        }
                        // Reply immediately with self profile + snapshot of known peers
                        broadcastEvent('I_AM_HERE', {
                            profile: buildSelfProfile(),
                            peersSnapshot: Object.values(peersRef.current).slice(0, 25),
                            focusState: userRef.current.role === 'teacher' ? {
                                enabled: focusModeRef.current,
                                screen: screenRef.current,
                                activeWorld: activeWorldRef.current
                            } : null
                        });
                        break;
                    }
                    case 'I_AM_HERE':
                    case 'PRESENCE_UPDATE': {
                        setPeers(prev => {
                            const next = { ...prev };
                            if (msg.payload?.profile?.id) {
                                next[msg.payload.profile.id] = { ...msg.payload.profile, lastSeen: Date.now() };
                            }
                            if (Array.isArray(msg.payload?.peersSnapshot)) {
                                msg.payload.peersSnapshot.forEach(p => {
                                    if (p && p.id && p.id !== selfId && !p.offline) {
                                        next[p.id] = { ...(next[p.id] || {}), ...p, lastSeen: p.lastSeen || Date.now() };
                                    }
                                });
                            }
                            return next;
                        });
                        if (msg.payload?.focusState && userRef.current.role !== 'teacher') {
                            const fs = msg.payload.focusState;
                            setFocusMode(!!fs.enabled);
                            if (fs.enabled) {
                                if (fs.activeWorld) setActiveWorld(fs.activeWorld);
                                if (fs.screen && !['home', 'identity'].includes(screenRef.current)) {
                                    setModal({ show: false, title: '', message: '', type: 'info', onClose: null });
                                    setScreen(fs.screen);
                                }
                            }
                        }
                        break;
                    }
                    case 'PEER_LEFT': {
                        const leftId = msg.payload?.id || msg.senderId;
                        if (leftId && leftId !== selfId) {
                            setPeers(prev => {
                                if (!prev[leftId]) return prev;
                                const copy = { ...prev };
                                delete copy[leftId];
                                return copy;
                            });
                            setActiveSpeaker(prev => (prev && prev.id === leftId ? null : prev));
                        }
                        break;
                    }
                    case 'CHAT': {
                        setChatMessages(prev => [
                            ...prev.slice(-60),
                            {
                                id: msg.msgId,
                                senderId: msg.senderId,
                                senderName: msg.senderName,
                                role: msg.role,
                                avatar: msg.avatar,
                                text: msg.payload?.text || '',
                                ts: msg.ts
                            }
                        ]);
                        break;
                    }
                    case 'FOCUS_MODE': {
                        if (userRef.current.role !== 'teacher') {
                            const enabled = !!msg.payload?.enabled;
                            setFocusMode(enabled);
                            if (enabled) {
                                if (msg.payload?.activeWorld) setActiveWorld(msg.payload.activeWorld);
                                if (msg.payload?.screen && !['home', 'identity'].includes(screenRef.current)) {
                                    setModal({ show: false, title: '', message: '', type: 'info', onClose: null });
                                    setScreen(msg.payload.screen);
                                }
                                showLiveBanner(`🎯 Teacher Focus Mode ON — Following ${msg.senderName}'s screen`);
                            } else {
                                showLiveBanner(`🔓 Teacher Focus Mode OFF — You are free to explore!`);
                            }
                        }
                        break;
                    }
                    case 'TEACHER_NAV': {
                        if (userRef.current.role !== 'teacher' && focusModeRef.current) {
                            if (msg.payload?.activeWorld) setActiveWorld(msg.payload.activeWorld);
                            if (msg.payload?.screen && !['home', 'identity'].includes(screenRef.current)) {
                                setModal({ show: false, title: '', message: '', type: 'info', onClose: null });
                                setScreen(msg.payload.screen);
                            }
                        }
                        break;
                    }
                    case 'STAGE_ADVANCE': {
                        if (msg.payload?.nextScreen && !['home', 'identity'].includes(screenRef.current)) {
                            if (msg.payload?.worldId) setActiveWorld(msg.payload.worldId);
                            setModal({ show: false, title: '', message: '', type: 'info', onClose: null });
                            setScreen(msg.payload.nextScreen);
                            showLiveBanner(`🚀 ${msg.senderName} solved it! Moving together to the next stage!`);
                        }
                        break;
                    }
                    case 'SYNC_ACTIVITY': {
                        const { kind, worldId, data, summary } = msg.payload || {};
                        if (kind) {
                            setSyncedState(prev => ({
                                ...prev,
                                [kind]: { worldId, data, senderName: msg.senderName, ts: msg.ts }
                            }));
                            if (summary) {
                                showLiveBanner(`✨ ${msg.senderName}: ${summary}`);
                            }
                        }
                        break;
                    }
                    case 'VOICE_START': {
                        setActiveSpeaker({ id: msg.senderId, name: msg.senderName, avatar: msg.avatar });
                        break;
                    }
                    case 'VOICE_END': {
                        setActiveSpeaker(prev => (prev && prev.id === msg.senderId ? null : prev));
                        break;
                    }
                    case 'VOICE_AUDIO': {
                        setActiveSpeaker({ id: msg.senderId, name: msg.senderName, avatar: msg.avatar });
                        setTimeout(() => {
                            setActiveSpeaker(prev => (prev && prev.id === msg.senderId ? null : prev));
                        }, 3000);
                        if (!voiceMutedRef.current && msg.payload?.audioData) {
                            try {
                                const audio = new Audio(msg.payload.audioData);
                                audio.play().catch(() => {});
                            } catch (e) {}
                        }
                        break;
                    }
                    default:
                        break;
                }
            }, [selfId, broadcastEvent, buildSelfProfile, showLiveBanner]);

            const syncNtfyPoll = useCallback((roomCode) => {
                fetch(`${NTFY_BASE}/dta_room_v4_${roomCode.toLowerCase()}/json?poll=1&since=3m`)
                    .then(r => r.text())
                    .then(text => {
                        if (!text) return;
                        text.split('\n').forEach(line => {
                            if (!line.trim()) return;
                            try {
                                const wrapper = JSON.parse(line);
                                if (wrapper && wrapper.event === 'message' && wrapper.message) {
                                    const parsed = JSON.parse(wrapper.message);
                                    handleIncomingMessage(parsed);
                                }
                            } catch (e) {}
                        });
                    })
                    .catch(() => {});
            }, [handleIncomingMessage]);

            // --- Connect to Room across all transports when logged in ---
            useEffect(() => {
                if (!isInRoom) return;
                const roomCode = normalizeRoomCode(user.roomCode);
                transportsSetRef.current = new Set();
                setConnectionStatus('connecting');
                setPeers(prev => ({ ...prev, [selfId]: buildSelfProfile() }));

                let unsubFirestore = () => {};
                let isMounted = true;

                // 1. Cloud Firestore (if configured)
                if (window.DTA_CLOUD) {
                    window.DTA_CLOUD.init().then((ok) => {
                        if (!ok || !isMounted) return;
                        markTransportActive('Cloud');
                        window.DTA_CLOUD.upsertPeer(roomCode, buildSelfProfile());
                        unsubFirestore = window.DTA_CLOUD.subscribeRoom(
                            roomCode,
                            (cloudPeers) => {
                                setPeers(prev => {
                                    const next = {};
                                    if (prev[selfId]) next[selfId] = prev[selfId];
                                    const now = Date.now();
                                    Object.values(prev).forEach(p => {
                                        if (p && p.id && p.id !== selfId && p.lastSeen && now - p.lastSeen < 35000) {
                                            next[p.id] = p;
                                        }
                                    });
                                    cloudPeers.forEach(p => {
                                        if (p && p.id && !p.offline) next[p.id] = { ...(next[p.id] || {}), ...p, lastSeen: Date.now() };
                                    });
                                    return next;
                                });
                            },
                            (ev) => handleIncomingMessage(ev),
                            (focusData) => {
                                if (userRef.current.role !== 'teacher' && focusData && typeof focusData.enabled === 'boolean') {
                                    setFocusMode(focusData.enabled);
                                    if (focusData.enabled) {
                                        if (focusData.activeWorld) setActiveWorld(focusData.activeWorld);
                                        if (focusData.screen && !['home', 'identity'].includes(screenRef.current)) {
                                            setModal({ show: false, title: '', message: '', type: 'info', onClose: null });
                                            setScreen(focusData.screen);
                                        }
                                    }
                                }
                            }
                        );
                    });
                }

                // 2. Multi-Broker MQTT WebSockets (Port 443 first)
                let brokerIndex = 0;
                const connectMqtt = () => {
                    if (!isMounted || typeof window.mqtt === 'undefined') return;
                    if (brokerIndex >= MQTT_BROKERS.length) return;
                    const brokerUrl = MQTT_BROKERS[brokerIndex];
                    try {
                        const client = window.mqtt.connect(brokerUrl, {
                            clientId: `${selfId}_${Math.random().toString(36).slice(2, 6)}`,
                            clean: true,
                            connectTimeout: 7000,
                            reconnectPeriod: 6000,
                            will: {
                                topic: `dta_v4/${roomCode}/presence/${selfId}`,
                                payload: JSON.stringify({ id: selfId, offline: true }),
                                qos: 0,
                                retain: true
                            }
                        });
                        mqttClientRef.current = client;

                        client.on('connect', () => {
                            if (!isMounted) return;
                            markTransportActive('MQTT');
                            client.subscribe(`dta_v4/${roomCode}/events`);
                            client.subscribe(`dta_v4/${roomCode}/presence/+`);
                            client.subscribe(`dta_v4/${roomCode}/focus`);
                            publishRetainedPresence();
                            if (userRef.current.role === 'teacher') {
                                publishRetainedFocus(focusModeRef.current, screenRef.current, activeWorldRef.current);
                            }
                            broadcastEvent('WHO_IS_HERE', { profile: buildSelfProfile() });
                        });

                        client.on('message', (topic, message) => {
                            try {
                                const data = JSON.parse(message.toString());
                                if (topic.includes('/presence/')) {
                                    if (data && data.id && data.id !== selfId) {
                                        if (data.offline) {
                                            setPeers(prev => {
                                                const copy = { ...prev };
                                                delete copy[data.id];
                                                return copy;
                                            });
                                        } else {
                                            setPeers(prev => ({ ...prev, [data.id]: { ...data, lastSeen: Date.now() } }));
                                        }
                                    }
                                } else if (topic.endsWith('/focus')) {
                                    if (userRef.current.role !== 'teacher' && data && typeof data.enabled === 'boolean') {
                                        setFocusMode(data.enabled);
                                        if (data.enabled) {
                                            if (data.activeWorld) setActiveWorld(data.activeWorld);
                                            if (data.screen && !['home', 'identity'].includes(screenRef.current)) {
                                                setModal({ show: false, title: '', message: '', type: 'info', onClose: null });
                                                setScreen(data.screen);
                                            }
                                        }
                                    }
                                } else {
                                    handleIncomingMessage(data);
                                }
                            } catch (e) {}
                        });

                        client.on('error', () => {
                            try { client.end(true); } catch (e) {}
                            brokerIndex++;
                            if (isMounted && brokerIndex < MQTT_BROKERS.length) connectMqtt();
                        });
                    } catch (e) {
                        brokerIndex++;
                        if (isMounted && brokerIndex < MQTT_BROKERS.length) connectMqtt();
                    }
                };
                connectMqtt();

                // 3. PeerJS WebRTC Relay (Host/Client room mesh)
                if (typeof window.Peer !== 'undefined') {
                    const hostPeerId = `dta-v4-host-${roomCode.toLowerCase()}`;
                    const initPeer = (desiredId, isHostAttempt) => {
                        try {
                            const peer = new window.Peer(desiredId, {
                                config: {
                                    iceServers: [
                                        { urls: 'stun:stun.l.google.com:19302' },
                                        { urls: 'stun:stun1.l.google.com:19302' }
                                    ]
                                }
                            });
                            peerJsRef.current = peer;

                            peer.on('open', () => {
                                if (!isMounted) return;
                                markTransportActive('P2P');
                                if (!isHostAttempt) {
                                    const conn = peer.connect(hostPeerId, { reliable: true });
                                    conn.on('open', () => {
                                        peerConnsRef.current[conn.peer] = conn;
                                        conn.send({
                                            msgId: `${selfId}_p2p_${Date.now()}`,
                                            type: 'WHO_IS_HERE',
                                            senderId: selfId,
                                            senderName: userRef.current.name,
                                            role: userRef.current.role,
                                            avatar: userRef.current.avatar,
                                            roomCode,
                                            payload: { profile: buildSelfProfile() },
                                            ts: Date.now()
                                        });
                                    });
                                    conn.on('data', (d) => handleIncomingMessage(d));
                                }
                            });

                            peer.on('connection', (conn) => {
                                conn.on('open', () => {
                                    peerConnsRef.current[conn.peer] = conn;
                                });
                                conn.on('data', (d) => {
                                    handleIncomingMessage(d);
                                    // Relay to all other connected peers if we are host
                                    if (isHostAttempt) {
                                        Object.entries(peerConnsRef.current).forEach(([pid, c]) => {
                                            if (pid !== conn.peer && c && c.open) {
                                                try { c.send(d); } catch (e) {}
                                            }
                                        });
                                    }
                                });
                            });

                            peer.on('error', (err) => {
                                if (isHostAttempt && err && err.type === 'unavailable-id') {
                                    try { peer.destroy(); } catch (e) {}
                                    if (isMounted) initPeer(undefined, false);
                                }
                            });
                        } catch (e) {}
                    };
                    initPeer(hostPeerId, true);
                }

                // 4. Port 443 HTTPS EventSource (SSE) + Initial Poll
                try {
                    const sse = new EventSource(`${NTFY_BASE}/dta_room_v4_${roomCode.toLowerCase()}/sse?since=3m`);
                    sseRef.current = sse;
                    sse.onopen = () => {
                        if (isMounted) markTransportActive('HTTPS');
                    };
                    sse.onmessage = (ev) => {
                        try {
                            const wrapper = JSON.parse(ev.data);
                            if (wrapper && wrapper.message) {
                                handleIncomingMessage(JSON.parse(wrapper.message));
                            }
                        } catch (e) {}
                    };
                } catch (e) {}
                syncNtfyPoll(roomCode);

                // 5. Same-device BroadcastChannel & localStorage bus
                if (typeof BroadcastChannel !== 'undefined') {
                    const bc = new BroadcastChannel(`dta_bc_v4_${roomCode}`);
                    bcRef.current = bc;
                    bc.onmessage = (ev) => handleIncomingMessage(ev.data);
                }
                const onStorageBus = (ev) => {
                    if (ev.key === `dta_ls_bus_${roomCode}` && ev.newValue) {
                        try { handleIncomingMessage(JSON.parse(ev.newValue)); } catch (e) {}
                    }
                };
                window.addEventListener('storage', onStorageBus);

                // Initial greeting broadcast
                const greetTimer = setTimeout(() => {
                    broadcastEvent('WHO_IS_HERE', { profile: buildSelfProfile() });
                }, 400);

                // Periodic presence keepalive (every 12s) so active members stay fresh
                const heartbeat = setInterval(() => {
                    const prof = buildSelfProfile();
                    publishRetainedPresence(prof);
                    broadcastEvent('PRESENCE_UPDATE', {
                        profile: prof,
                        focusState: userRef.current.role === 'teacher' ? {
                            enabled: focusModeRef.current,
                            screen: screenRef.current,
                            activeWorld: activeWorldRef.current
                        } : null
                    });
                }, 12000);

                // Automatic stale-peer removal (removes students/teachers who closed tab or lost connection > 35s)
                const pruneTimer = setInterval(() => {
                    const now = Date.now();
                    setPeers(prev => {
                        let changed = false;
                        const next = {};
                        Object.entries(prev).forEach(([id, p]) => {
                            if (id === selfId || !p.lastSeen || now - p.lastSeen < 35000) {
                                next[id] = p;
                            } else {
                                changed = true;
                            }
                        });
                        return changed ? next : prev;
                    });
                }, 10000);

                // Notify room immediately when tab/browser closes or navigates away
                const handleBeforeUnload = () => {
                    const leaveEnvelope = {
                        msgId: `${selfId}_leave_${Date.now()}`,
                        type: 'PEER_LEFT',
                        senderId: selfId,
                        senderName: userRef.current.name,
                        role: userRef.current.role || 'student',
                        avatar: userRef.current.avatar || '🕵️‍♂️',
                        roomCode,
                        payload: { id: selfId },
                        ts: Date.now()
                    };
                    try {
                        if (mqttClientRef.current && mqttClientRef.current.connected) {
                            mqttClientRef.current.publish(`dta_v4/${roomCode}/events`, JSON.stringify(leaveEnvelope));
                            mqttClientRef.current.publish(
                                `dta_v4/${roomCode}/presence/${selfId}`,
                                JSON.stringify({ id: selfId, offline: true }),
                                { retain: true }
                            );
                        }
                    } catch (e) {}
                    try {
                        if (navigator.sendBeacon) {
                            navigator.sendBeacon(`${NTFY_BASE}/dta_room_v4_${roomCode.toLowerCase()}`, JSON.stringify(leaveEnvelope));
                        } else {
                            fetch(`${NTFY_BASE}/dta_room_v4_${roomCode.toLowerCase()}`, {
                                method: 'POST',
                                body: JSON.stringify(leaveEnvelope),
                                keepalive: true
                            }).catch(() => {});
                        }
                    } catch (e) {}
                    try {
                        if (bcRef.current) bcRef.current.postMessage(leaveEnvelope);
                        localStorage.setItem(`dta_ls_bus_${roomCode}`, JSON.stringify(leaveEnvelope));
                    } catch (e) {}
                    try {
                        if (window.DTA_CLOUD && window.DTA_CLOUD.ready) {
                            window.DTA_CLOUD.removePeer(roomCode, selfId);
                        }
                    } catch (e) {}
                };
                window.addEventListener('beforeunload', handleBeforeUnload);
                window.addEventListener('pagehide', handleBeforeUnload);

                return () => {
                    isMounted = false;
                    clearTimeout(greetTimer);
                    clearInterval(heartbeat);
                    clearInterval(pruneTimer);
                    window.removeEventListener('beforeunload', handleBeforeUnload);
                    window.removeEventListener('pagehide', handleBeforeUnload);
                    window.removeEventListener('storage', onStorageBus);
                    handleBeforeUnload();
                    unsubFirestore();
                    if (window.DTA_CLOUD && window.DTA_CLOUD.ready) {
                        window.DTA_CLOUD.removePeer(roomCode, selfId);
                    }
                    if (mqttClientRef.current) {
                        try {
                            mqttClientRef.current.publish(
                                `dta_v4/${roomCode}/presence/${selfId}`,
                                JSON.stringify({ id: selfId, offline: true }),
                                { retain: true }
                            );
                            mqttClientRef.current.end(true);
                        } catch (e) {}
                        mqttClientRef.current = null;
                    }
                    if (peerJsRef.current) {
                        try { peerJsRef.current.destroy(); } catch (e) {}
                        peerJsRef.current = null;
                    }
                    peerConnsRef.current = {};
                    if (sseRef.current) {
                        try { sseRef.current.close(); } catch (e) {}
                        sseRef.current = null;
                    }
                    if (bcRef.current) {
                        try { bcRef.current.close(); } catch (e) {}
                        bcRef.current = null;
                    }
                };
            }, [isInRoom, user.roomCode, selfId, buildSelfProfile, publishRetainedPresence, publishRetainedFocus, broadcastEvent, handleIncomingMessage, markTransportActive, syncNtfyPoll]);

            // Keep own peer presence updated when points, screen, or world change
            useEffect(() => {
                if (!isInRoom) return;
                const prof = buildSelfProfile();
                setPeers(prev => ({ ...prev, [selfId]: prof }));
                publishRetainedPresence(prof);
            }, [isInRoom, selfId, progress.points, progress.stars, screen, activeWorld, focusMode, buildSelfProfile, publishRetainedPresence]);

            const handleForceSync = useCallback(() => {
                const roomCode = normalizeRoomCode(userRef.current.roomCode);
                const prof = buildSelfProfile();
                publishRetainedPresence(prof);
                broadcastEvent('WHO_IS_HERE', { profile: prof });
                syncNtfyPoll(roomCode);
                showLiveBanner("🔄 Syncing room members...");
            }, [buildSelfProfile, publishRetainedPresence, broadcastEvent, syncNtfyPoll, showLiveBanner]);

            const saveMicGuardSnapshot = useCallback(() => {
                try {
                    const snap = JSON.stringify({
                        selfId,
                        user: userRef.current,
                        progress: progressRef.current,
                        screen: screenRef.current,
                        activeWorld: activeWorldRef.current,
                        focusMode: focusModeRef.current,
                        savedAt: Date.now()
                    });
                    sessionStorage.setItem(SESSION_STORAGE_KEY, snap);
                    localStorage.setItem(MIC_GUARD_STORAGE_KEY, snap);
                } catch (e) {}
            }, [selfId]);

            // --- Navigation helper (Teacher Focus Mode syncs screen to all students & locks student navigation) ---
            const navigateTo = useCallback((nextScreen, nextWorld = null, forceAllow = false) => {
                if (!forceAllow && userRef.current.role !== 'teacher' && focusModeRef.current) {
                    showLiveBanner("🔒 Teacher Focus Mode is ON — Follow the Teacher's screen!");
                    return;
                }
                const resolvedWorld = nextWorld || activeWorldRef.current;
                if (nextWorld) setActiveWorld(nextWorld);
                setScreen(nextScreen);
                if (userRef.current.role === 'teacher' && focusModeRef.current) {
                    publishRetainedFocus(true, nextScreen, resolvedWorld);
                    broadcastEvent('TEACHER_NAV', { screen: nextScreen, activeWorld: resolvedWorld });
                }
            }, [broadcastEvent, publishRetainedFocus, showLiveBanner]);

            const startTeacherFocusFromDashboard = useCallback((requestedRoomCode) => {
                const roomCode = normalizeRoomCode(requestedRoomCode || userRef.current.roomCode || DEFAULT_ROOM_CODE);
                const teacherUser = {
                    ...userRef.current,
                    name: userRef.current.name || 'Teacher',
                    class: userRef.current.class || 'VII',
                    role: 'teacher',
                    avatar: '👩‍🏫',
                    roomCode
                };
                userRef.current = teacherUser;
                setUser(teacherUser);
                focusModeRef.current = true;
                setFocusMode(true);
                setScreen('map');

                setTimeout(() => {
                    publishRetainedFocus(true, 'map', activeWorldRef.current);
                    broadcastEvent('FOCUS_MODE', {
                        enabled: true,
                        screen: 'map',
                        activeWorld: activeWorldRef.current
                    });
                    showLiveBanner(`🎯 Teacher Focus Mode ON (Room ${roomCode}) — All students now follow your screen!`);
                }, 450);
            }, [publishRetainedFocus, broadcastEvent, showLiveBanner]);

            const completeAndAdvance = useCallback((points, stars, missionId, nextScreen, worldIdOverride = null) => {
                setProgress(prev => {
                    const alreadyDone = missionId && prev.completed.includes(missionId);
                    const earnedPts = alreadyDone ? 0 : points + (missionId ? 20 : 0);
                    const earnedStars = alreadyDone ? 0 : stars;
                    const newCompleted = (missionId && !alreadyDone) ? [...prev.completed, missionId] : prev.completed;

                    if (earnedPts > 0 || earnedStars > 0) {
                        setRewardAnim({ points: earnedPts, stars: earnedStars });
                        setTimeout(() => setRewardAnim(null), 1800);
                    }

                    return {
                        points: prev.points + earnedPts,
                        stars: prev.stars + earnedStars,
                        completed: newCompleted
                    };
                });

                const resolvedWorld = worldIdOverride || activeWorldRef.current;
                if (worldIdOverride) setActiveWorld(worldIdOverride);
                setScreen(nextScreen);

                if (userRef.current.role === 'teacher' && focusModeRef.current) {
                    publishRetainedFocus(true, nextScreen, resolvedWorld);
                }
                broadcastEvent('STAGE_ADVANCE', { nextScreen, worldId: resolvedWorld });
            }, [broadcastEvent, publishRetainedFocus]);

            // --- Clean up Mic Test Resources ---
            const closeMicOverlay = useCallback(() => {
                if (micTestTimerRef.current) {
                    clearTimeout(micTestTimerRef.current);
                    micTestTimerRef.current = null;
                }
                if (micTestIntervalRef.current) {
                    clearInterval(micTestIntervalRef.current);
                    micTestIntervalRef.current = null;
                }
                if (micTestStreamRef.current) {
                    try { micTestStreamRef.current.getTracks().forEach(t => t.stop()); } catch (e) {}
                    micTestStreamRef.current = null;
                }
                if (micTestCtxRef.current) {
                    try { micTestCtxRef.current.close(); } catch (e) {}
                    micTestCtxRef.current = null;
                }
                setMicOverlay({ open: false, status: '', level: 0, state: 'idle' });
                try { localStorage.removeItem(MIC_GUARD_STORAGE_KEY); } catch (e) {}
            }, []);

            // --- Safe Mic Test (Dedicated Anti-Reset Overlay Panel with Live Level Meter) ---
            const handleTestMic = async (e) => {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                saveMicGuardSnapshot();
                closeMicOverlay();

                setMicOverlay({
                    open: true,
                    status: "🎤 Requesting microphone permission...",
                    level: 0,
                    state: 'testing'
                });

                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        setMicOverlay({
                            open: true,
                            status: "⚠️ Microphone is not supported in this browser. Your game progress stays safe on this page.",
                            level: 0,
                            state: 'error'
                        });
                        return;
                    }
                    const testStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    micTestStreamRef.current = testStream;

                    setMicOverlay({
                        open: true,
                        status: "🎙️ Microphone active! Say something to test your voice level...",
                        level: 8,
                        state: 'listening'
                    });

                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        const testAudioCtx = new AudioCtx();
                        micTestCtxRef.current = testAudioCtx;
                        const source = testAudioCtx.createMediaStreamSource(testStream);
                        const analyser = testAudioCtx.createAnalyser();
                        analyser.fftSize = 256;
                        source.connect(analyser);
                        const freqData = new Uint8Array(analyser.frequencyBinCount);
                        let peakLevel = 0;

                        micTestIntervalRef.current = setInterval(() => {
                            try {
                                analyser.getByteFrequencyData(freqData);
                                let sum = 0;
                                for (let i = 0; i < freqData.length; i++) sum += freqData[i];
                                const avg = sum / freqData.length;
                                const scaled = Math.min(100, Math.round(avg * 2.2));
                                if (avg > peakLevel) peakLevel = avg;
                                setMicOverlay(prev => prev.open ? { ...prev, level: scaled } : prev);
                            } catch (err) {}
                        }, 80);

                        micTestTimerRef.current = setTimeout(() => {
                            if (micTestIntervalRef.current) {
                                clearInterval(micTestIntervalRef.current);
                                micTestIntervalRef.current = null;
                            }
                            if (micTestStreamRef.current) {
                                try { micTestStreamRef.current.getTracks().forEach(t => t.stop()); } catch (err) {}
                                micTestStreamRef.current = null;
                            }
                            if (micTestCtxRef.current) {
                                try { micTestCtxRef.current.close(); } catch (err) {}
                                micTestCtxRef.current = null;
                            }
                            setMicOverlay({
                                open: true,
                                status: peakLevel > 4
                                    ? "✅ Microphone works great & voice detected! Ready to use Hold to Talk."
                                    : "✅ Microphone connected! Press & hold 'Hold to Talk' to speak to the class.",
                                level: peakLevel > 4 ? 85 : 25,
                                state: 'success'
                            });
                        }, 3000);
                    } else {
                        testStream.getTracks().forEach(t => t.stop());
                        micTestStreamRef.current = null;
                        setMicOverlay({
                            open: true,
                            status: "✅ Microphone active & ready to use!",
                            level: 70,
                            state: 'success'
                        });
                    }
                } catch (err) {
                    if (micTestStreamRef.current) {
                        try { micTestStreamRef.current.getTracks().forEach(t => t.stop()); } catch (e2) {}
                        micTestStreamRef.current = null;
                    }
                    if (micTestCtxRef.current) {
                        try { micTestCtxRef.current.close(); } catch (e2) {}
                        micTestCtxRef.current = null;
                    }
                    setMicOverlay({
                        open: true,
                        status: "🚫 Microphone permission was denied or cancelled. Your game stays safely on this page!",
                        level: 0,
                        state: 'error'
                    });
                }
            };

            // --- Walkie-Talkie Push-to-Talk Handlers (Anti-Reset) ---
            const startTalking = async (e) => {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                if (isTalkingRef.current) return;
                saveMicGuardSnapshot();
                isTalkingRef.current = true;

                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        isTalkingRef.current = false;
                        setMicTestStatus("⚠️ Microphone unavailable on this device.");
                        setTimeout(() => setMicTestStatus(null), 3000);
                        return;
                    }
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaStreamRef.current = stream;
                    audioChunksRef.current = [];

                    const recorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = recorder;
                    recorder.ondataavailable = (ev) => {
                        if (ev.data && ev.data.size > 0) audioChunksRef.current.push(ev.data);
                    };
                    recorder.onstop = () => {
                        try {
                            const blob = new Blob(audioChunksRef.current, { type: recorder.mimeType || 'audio/webm' });
                            if (blob.size > 200 && blob.size < 450000) {
                                const reader = new FileReader();
                                reader.onloadend = () => {
                                    if (reader.result) {
                                        broadcastEvent('VOICE_AUDIO', { audioData: reader.result });
                                    }
                                };
                                reader.readAsDataURL(blob);
                            }
                        } catch (err) {}
                        if (mediaStreamRef.current) {
                            mediaStreamRef.current.getTracks().forEach(t => t.stop());
                            mediaStreamRef.current = null;
                        }
                    };

                    recorder.start();
                    setIsTalking(true);
                    setActiveSpeaker({ id: selfId, name: userRef.current.name, avatar: userRef.current.avatar });
                    broadcastEvent('VOICE_START', {});
                } catch (err) {
                    isTalkingRef.current = false;
                    setIsTalking(false);
                    setMicTestStatus("🚫 Mic permission denied (Game stays on this page).");
                    setTimeout(() => setMicTestStatus(null), 3500);
                }
            };

            const stopTalking = (e) => {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                if (!isTalkingRef.current) return;
                isTalkingRef.current = false;
                setIsTalking(false);
                setActiveSpeaker(prev => (prev && prev.id === selfId ? null : prev));
                broadcastEvent('VOICE_END', {});
                try {
                    if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
                        mediaRecorderRef.current.stop();
                    } else if (mediaStreamRef.current) {
                        mediaStreamRef.current.getTracks().forEach(t => t.stop());
                        mediaStreamRef.current = null;
                    }
                } catch (err) {}
            };

            const toggleFocusMode = () => {

            const handleSendChat = (text) => {

            const addReward = (points, stars, missionId = null) => {

                    const earnedPts = alreadyDone ? 0 : points + (missionId ? 20 : 0);
                    const earnedStars = alreadyDone ? 0 : stars;
                    const newCompleted = (missionId && !alreadyDone) ? [...prev.completed, missionId] : prev.completed;

                    if (earnedPts > 0 || earnedStars > 0) {

                        setTimeout(() => setRewardAnim(null), 1800);

                    return {
                        points: prev.points + earnedPts,
                        stars: prev.stars + earnedStars,
                        completed: newCompleted

            const saveSession = (reflectionData) => {
                try {
                    const history = JSON.parse(localStorage.getItem('dta_teacher_data') || '[]');
                    history.push({
                        date: new Date().toISOString(),

                    localStorage.setItem('dta_teacher_data', JSON.stringify(history));

                    console.error("LocalStorage unavailable", e);

            const openWorld = (worldId) => {

            const hideHeaderScreens = ['home', 'identity', 'credits', 'dashboard'];
            const peerList = Object.values(peers);

            return (

                    {/* Floating Top-Right Audio & Fullscreen Bar on screens without main header */}
                    {hideHeaderScreens.includes(screen) && (

                    {/* Top Navigation Bar */}
                    {!hideHeaderScreens.includes(screen) && (

                                    className="bg-blue-800 hover:bg-blue-700 p-2 rounded-xl border-2 border-blue-600 flex items-center justify-center shadow-inner transition"
                                    title="Adventure Map"
                                >
                                    <span className="text-2xl">{user.avatar || '🕵️‍♂️'}</span>
                                </button>
                                <div>
                                    <div className="font-black text-sm md:text-base leading-tight flex items-center gap-1.5">
                                        <span>{user.name || 'Young Detective'}</span>
                                        {user.role === 'teacher' ? (
                                            <span className="bg-brand-yellow text-yellow-950 text-[10px] px-2 py-0.5 rounded-full font-black">TEACHER</span>
                                        ) : (
                                            <span className="bg-brand-sky/25 text-brand-sky text-[10px] px-2 py-0.5 rounded-full font-black border border-brand-sky/40">STUDENT</span>
                                        )}
                                    </div>
                                    <div className="text-brand-sky text-[11px] font-bold flex flex-wrap items-center gap-1.5">
                                        <span>{user.class ? `Class ${user.class}` : 'Grade VII'}</span>
                                        {isInRoom && (
                                            <span className="bg-slate-900/60 px-2 py-0.5 rounded-full border border-slate-700 text-white">
                                                {connectionStatus === 'connected' ? '🟢' : '🟡'} Room: {normalizeRoomCode(user.roomCode)}
                                            </span>
                                        )}
                                        {focusMode && user.role !== 'teacher' && (
                                            <span className="bg-amber-400 text-amber-950 px-2 py-0.5 rounded-full font-black">🎯 Teacher Focus</span>
                                        )}
                                    </div>
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-1.5 md:gap-2">
                                {/* Top Lofi Study Music & Fullscreen Bar */}
                                <TopAudioBar
                                    isPlaying={lofiPlaying}
                                    volume={lofiVolume}
                                    onToggle={toggleLofi}
                                    onVolumeChange={changeLofiVolume}
                                    isPseudoFs={pseudoFullscreen}
                                    onTogglePseudoFs={setPseudoFullscreen}
                                />

                                {/* Teacher Focus Mode Toggle */}
                                {isInRoom && user.role === 'teacher' && (
                                    <button
                                        type="button"
                                        onClick={toggleFocusMode}
                                        className={`px-3 py-1.5 rounded-full text-xs font-black border-2 transition ${
                                            focusMode
                                                ? 'bg-amber-400 text-amber-950 border-yellow-200 shadow-md'
                                                : 'bg-slate-800 text-slate-200 border-slate-600 hover:bg-slate-700'
                                        }`}
                                        title="Enable so students follow your screen"
                                    >
                                        {focusMode ? '🔓 Turn Off Focus Mode' : '🎯 Focus: OFF'}
                                    </button>

                                {/* Walkie-Talkie Push-to-Talk & Test Mic */}
                                {isInRoom && (
                                    <div className="flex items-center gap-1 bg-slate-900/70 px-2 py-1 rounded-full border border-slate-700">
                                        <button

                                            onMouseDown={startTalking}

                                            className={`px-3 py-1 rounded-full text-xs font-black transition select-none ${
                                                isTalking
                                                    ? 'bg-red-500 text-white ptt-active'

                                            title="Press and hold to talk to the room"

                                        <button

                                            title="Test microphone safely"
                                        >
                                            Test Mic

                                        <button
                                            type="button"
                                            onClick={() => setVoiceMuted(m => !m)}
                                            className={`w-7 h-7 rounded-full flex items-center justify-center text-xs ${
                                                voiceMuted ? 'bg-red-500/80 text-white' : 'bg-slate-700 text-emerald-300'
                                            }`}
                                            title={voiceMuted ? "Unmute Room Voice" : "Mute Room Voice"}
                                        >
                                            {voiceMuted ? '🔇' : '🔊'}
                                        </button>
                                    </div>
                                )}

                                {/* Score & Stars */}
                                <div className="flex items-center gap-1 bg-slate-800/70 px-2.5 py-1 rounded-full border border-slate-700">
                                    <IconCoin className="w-4 h-4" />
                                    <span className="font-black text-brand-yellow text-sm">{progress.points}</span>
                                </div>
                                <div className="flex items-center gap-1 bg-slate-800/70 px-2.5 py-1 rounded-full border border-slate-700">
                                    <IconStar className="w-4 h-4 text-brand-orange" />
                                    <span className="font-black text-brand-orange text-sm">{progress.stars}</span>
                                </div>

                                <button type="button" onClick={() => navigateTo('map')} className="hidden sm:flex btn-3d btn-secondary px-3 py-1.5 text-xs rounded-lg">
                                    🗺️ Map
                                </button>
                                <button type="button" onClick={() => navigateTo('credits')} className="hidden lg:flex btn-3d bg-slate-700 text-white border-2 border-slate-500 shadow-[0_4px_0_#334155] px-3 py-1.5 text-xs rounded-lg">
                                    🎓 Info
                                </button>
                            </div>
                        </header>
                    )}

                    {/* Live Classmates Strip & Status Banners */}
                    {isInRoom && !hideHeaderScreens.includes(screen) && (
                        <div className="bg-slate-900/90 border-b border-slate-700 px-3 py-1.5 flex items-center gap-2 overflow-x-auto text-xs text-white">
                            <span className="font-black text-brand-sky shrink-0">🏫 Online ({peerList.length}):</span>
                            {peerList.map((p) => (
                                <span
                                    key={p.id}
                                    className={`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full font-bold shrink-0 border ${
                                        activeSpeaker?.id === p.id
                                            ? 'bg-emerald-500 text-emerald-950 border-emerald-300 animate-pulse'
                                            : p.role === 'teacher'
                                            ? 'bg-amber-400/20 text-amber-200 border-amber-400/50'
                                            : 'bg-slate-800 text-slate-200 border-slate-700'
                                    }`}
                                >
                                    <span>{p.avatar || '🕵️‍♂️'}</span>
                                    <span>{p.name}</span>
                                    {activeSpeaker?.id === p.id && <span>🎙️</span>}
                                </span>
                            ))}
                        </div>
                    )}

                    {/* Teacher Focus Mode Active Top Control Bar */}
                    {isInRoom && focusMode && !hideHeaderScreens.includes(screen) && (
                        <div className={`px-4 py-2 text-xs sm:text-sm font-black flex flex-wrap items-center justify-between gap-2 shadow-md z-30 ${
                            user.role === 'teacher'
                                ? 'bg-amber-400 text-amber-950 border-b-2 border-amber-500'
                                : 'bg-blue-600 text-white border-b-2 border-blue-800'
                        }`}>
                            <div className="flex items-center gap-2">
                                <span>{user.role === 'teacher' ? '🎯' : '🔒'}</span>
                                <span>
                                    {user.role === 'teacher'

                                </span>
                            </div>
                            {user.role === 'teacher' && (
                                <button
                                    type="button"
                                    onClick={toggleFocusMode}
                                    className="bg-red-600 hover:bg-red-700 text-white px-3.5 py-1 rounded-full text-xs font-black shadow transition"
                                >
                                    🔓 Turn Off Focus Mode
                                </button>
                            )}
                        </div>
                    )}

                    {/* Dedicated Anti-Reset Mic Test Overlay Panel */}
                    {micOverlay.open && (

                            <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-[0_10px_0_#94a3b8] border-4 border-brand-sky animate-pop text-center">
                                <div className="text-4xl mb-2">
                                    {micOverlay.state === 'success' ? '✅' : micOverlay.state === 'error' ? '🚫' : '🎙️'}
                                </div>
