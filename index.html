                                <p className="text-xs font-bold text-slate-500 mb-3">
                                    Anti-Reset Active — Your game position & score are safely saved.
                                </p>
                                <p className="text-sm font-bold text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-200 mb-4">
                                    {micOverlay.status}
                                </p>
                                {/* Live Audio Meter Bar */}
                                <div className="w-full bg-slate-200 rounded-full h-4 overflow-hidden mb-5 border border-slate-300">
                                    <div
                                        className={`h-full transition-all duration-100 ${
                                            micOverlay.state === 'error' ? 'bg-red-400' : 'bg-gradient-to-r from-emerald-400 to-brand-teal'
                                        }`}
                                        style={{ width: `${Math.max(4, micOverlay.level)}%` }}
                                    ></div>
                                </div>
                                <div className="flex gap-2">
                                    <button
                                        type="button"

                    {/* Mic Test or Live Sync Notification Toast */}
                    {(micTestStatus || liveActivityBanner) && (

                            {micTestStatus || liveActivityBanner}

                                {rewardAnim.stars > 0 && (

                                        +{rewardAnim.stars} <IconStar className="w-5 h-5" />

                    {/* Global Custom Modal (No alert/confirm) */}
                    {modal.show && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full shadow-[0_10px_0_#94a3b8] border-4 border-slate-200 animate-pop">
                                <div className="text-center mb-6">
                                    <div className={`inline-flex items-center justify-center w-20 h-20 rounded-full mb-4 ${
                                        modal.type === 'success' ? 'bg-green-100 text-green-600' :

        // =========================================================================
        // 11. STAGE 2: INTERACTIVE DRAG & DROP CATEGORY SORTER (MULTIPLAYER SYNCED)
        // =========================================================================
        const ScreenDragDropSorter = ({ world, showModal, syncedUpdate, onBroadcastActivity, onBack, onComplete }) => {
            const shuffledInitial = useMemo(() => {
                return [...world.sortItems].sort(() => Math.random() - 0.5);
            }, [world.id]);

            const [bank, setBank] = useState(shuffledInitial);
            const [boxes, setBoxes] = useState(() => {
                const init = {};
                world.categories.forEach(c => { init[c.id] = []; });
                return init;
            });
            const [selectedItem, setSelectedItem] = useState(null);
            const [dragOverCat, setDragOverCat] = useState(null);
            const [checkedStatus, setCheckedStatus] = useState(null);

            useEffect(() => {
                setBank([...world.sortItems].sort(() => Math.random() - 0.5));
                const init = {};
                world.categories.forEach(c => { init[c.id] = []; });
                setBoxes(init);
                setSelectedItem(null);
                setCheckedStatus(null);
            }, [world.id]);

            // Apply live multiplayer updates from classmates/teacher
            useEffect(() => {
                if (syncedUpdate && syncedUpdate.worldId === world.id && syncedUpdate.data) {
                    const { bankIds, boxIds } = syncedUpdate.data;
                    const byId = {};
                    world.sortItems.forEach(i => { byId[i.id] = i; });
                    if (Array.isArray(bankIds)) {
                        setBank(bankIds.map(id => byId[id]).filter(Boolean));
                    }
                    if (boxIds) {
                        const rebuilt = {};
                        world.categories.forEach(c => {
                            rebuilt[c.id] = (boxIds[c.id] || []).map(id => byId[id]).filter(Boolean);
                        });
                        setBoxes(rebuilt);
                    }
                    setCheckedStatus(null);
                }
            }, [syncedUpdate, world]);

            const moveItemToCategory = (itemId, targetCatId) => {
                setCheckedStatus(null);
                let item = bank.find(i => i.id === itemId);
                let newBank = [...bank];
                const newBoxes = {};
                world.categories.forEach(c => { newBoxes[c.id] = [...boxes[c.id]]; });

                if (item) {
                    newBank = newBank.filter(i => i.id !== itemId);
                } else {
                    for (const catId of Object.keys(newBoxes)) {
                        const found = newBoxes[catId].find(i => i.id === itemId);
                        if (found) {
                            item = found;
                            newBoxes[catId] = newBoxes[catId].filter(i => i.id !== itemId);
                            break;
                        }
                    }
                }

                if (!item) return;

                if (targetCatId === 'bank') {
                    newBank.push(item);
                } else {
                    newBoxes[targetCatId].push(item);
                }

                setBank(newBank);
                setBoxes(newBoxes);
                setSelectedItem(null);

                if (onBroadcastActivity) {
                    const boxIds = {};
                    Object.keys(newBoxes).forEach(k => { boxIds[k] = newBoxes[k].map(x => x.id); });
                    onBroadcastActivity(
                        { bankIds: newBank.map(x => x.id), boxIds },
                        `moved "${item.text}"`
                    );
                }
            };

            const handleDragStart = (e, itemId) => {
                e.dataTransfer.setData('text/plain', itemId);
                setSelectedItem(itemId);
            };

            const handleDrop = (e, targetCatId) => {
                e.preventDefault();
                setDragOverCat(null);
                const itemId = e.dataTransfer.getData('text/plain') || selectedItem;
                if (itemId) moveItemToCategory(itemId, targetCatId);
            };

            const handleReset = () => {
                const freshBank = [...world.sortItems].sort(() => Math.random() - 0.5);
                const init = {};
                world.categories.forEach(c => { init[c.id] = []; });
                setBank(freshBank);
                setBoxes(init);
                setSelectedItem(null);
                setCheckedStatus(null);
            };

            const handleCheck = () => {
                if (bank.length > 0) {
                    showModal("Almost There! 🧲", `Please sort all remaining ${bank.length} card(s) into the boxes first.`, "info");
                    return;
                }

                const statusMap = {};
                let correctCount = 0;
                world.categories.forEach(cat => {
                    boxes[cat.id].forEach(item => {
                        const isRight = item.category === cat.id;
                        statusMap[item.id] = isRight;
                        if (isRight) correctCount++;
                    });
                });
                setCheckedStatus(statusMap);

                if (correctCount === world.sortItems.length) {
                    showModal(
                        "Awesome Job! 🌟",
                        `You sorted all ${correctCount} phrases about ${world.subjectTitle} into the correct boxes!`,
                        "success",
                        onComplete
                    );
                } else {
                    showModal(
                        "Keep Trying! 🔍",
                        `You got ${correctCount} out of ${world.sortItems.length} correct. Red cards are in the wrong box—drag or tap them to move them!`,
                        "error"
                    );
                }
            };

            return (
                <div className={`flex-1 p-4 md:p-6 ${world.themeBg} overflow-y-auto`}>
                    <div className="max-w-5xl mx-auto">
                        <div className="flex flex-wrap justify-between items-center gap-2 mb-4">
                            <button type="button" onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#cbd5e1] px-4 py-2 text-xs md:text-sm">
                                ⬅️ Back to {world.name}
                            </button>
                            <span className={`text-xs font-black px-3 py-1.5 rounded-full border ${world.badgeColor}`}>
                                🧲 Interactive Vocabulary Sorter • {world.subjectTitle}
                            </span>
                        </div>

                        <div className="game-card p-5 md:p-6 animate-pop space-y-5">
                            <div className="flex flex-col md:flex-row items-center gap-5 bg-slate-50 p-4 rounded-2xl border-2 border-slate-200">
                                <div className="w-full md:w-56 shrink-0">
                                    <TopicIllustration topicId={world.id} className="w-full h-36 rounded-xl" />
                                </div>
                                <div>
                                    <h2 className="text-2xl font-black text-brand-deep">Drag & Drop Into the Right Box!</h2>
                                    <p className="text-sm font-bold text-slate-600 mt-1">
                                        Look at the picture of <span className="text-brand-deep">{world.subjectTitle}</span>. Drag each phrase from the list below into the empty category boxes.
                                    </p>
                                    <p className="text-xs font-bold text-blue-600 mt-1">
                                        💡 Tip: Drag a card into a category box, or tap a card and then tap the target box (touchscreen-friendly!).
                                    </p>
                                </div>
                            </div>

                            {/* Empty Category Drop Boxes */}
                            <div className={`grid grid-cols-1 ${world.categories.length === 3 ? 'md:grid-cols-3' : 'md:grid-cols-2'} gap-4`}>
                                {world.categories.map(cat => (
                                    <div
                                        key={cat.id}
                                        onDragOver={(e) => { e.preventDefault(); setDragOverCat(cat.id); }}
                                        onDragLeave={() => setDragOverCat(null)}
                                        onDrop={(e) => handleDrop(e, cat.id)}
                                        onClick={() => { if (selectedItem) moveItemToCategory(selectedItem, cat.id); }}
                                        className={`drop-zone rounded-2xl border-4 border-dashed min-h-[210px] flex flex-col overflow-hidden ${cat.color} ${
                                            dragOverCat === cat.id ? 'drag-over' : ''
                                        } ${selectedItem ? 'cursor-pointer ring-2 ring-brand-sky/60' : ''}`}
                                    >
                                        <div className={`${cat.headerBg} text-white font-black px-4 py-2.5 flex justify-between items-center`}>
                                            <span>{cat.icon} {cat.label}</span>
                                            <span className="bg-white/25 px-2 py-0.5 rounded-full text-xs">{boxes[cat.id].length}</span>
                                        </div>
                                        <div className="p-3 flex-1 flex flex-col gap-2">
                                            {boxes[cat.id].length === 0 ? (
                                                <div className="flex-1 flex items-center justify-center text-slate-400 font-bold text-sm text-center p-4">
                                                    {selectedItem ? "Tap here to drop selected card!" : "Empty box — Drop phrases here"}
                                                </div>
                                            ) : (
                                                boxes[cat.id].map(item => {
                                                    const status = checkedStatus ? checkedStatus[item.id] : null;
                                                    return (
                                                        <div
                                                            key={item.id}
                                                            draggable
                                                            onDragStart={(e) => handleDragStart(e, item.id)}
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                moveItemToCategory(item.id, 'bank');
                                                            }}
                                                            title="Drag to move or click to return to bank"
                                                            className={`drag-chip px-3 py-2 rounded-xl font-bold text-sm shadow-sm border-2 flex justify-between items-center gap-2 ${
                                                                status === true ? 'bg-green-100 border-green-500 text-green-900' :
                                                                status === false ? 'bg-red-100 border-red-500 text-red-900' :
                                                                'bg-white border-slate-200 text-slate-800 hover:border-brand-sky'
                                                            }`}
                                                        >
                                                            <span>{item.text}</span>
                                                            <span className="text-xs opacity-60 shrink-0">
                                                                {status === true ? '✅' : status === false ? '❌' : '↩️'}
                                                            </span>
                                                        </div>
                                                    );
                                                })
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Shuffled Phrase Bank */}
                            <div
                                onDragOver={(e) => e.preventDefault()}
                                onDrop={(e) => handleDrop(e, 'bank')}
                                className="bg-slate-100 rounded-2xl p-4 border-2 border-slate-300"
                            >
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="font-black text-slate-700 text-sm uppercase">
                                        📦 Phrase List ({bank.length} remaining)
                                    </h3>
                                    {selectedItem && (
                                        <span className="text-xs font-black text-blue-600 animate-pulse">
                                            Card selected! Tap a box above to drop it.
                                        </span>
                                    )}
                                </div>
                                {bank.length === 0 ? (
                                    <p className="text-center text-green-600 font-black py-3">
                                        🎉 All cards placed! Click "CHECK ANSWERS" below.
                                    </p>
                                ) : (
                                    <div className="flex flex-wrap gap-2">
                                        {bank.map(item => (
                                            <button
                                                key={item.id}
                                                type="button"
                                                draggable
                                                onDragStart={(e) => handleDragStart(e, item.id)}
                                                onClick={() => setSelectedItem(selectedItem === item.id ? null : item.id)}
                                                className={`drag-chip px-3.5 py-2 rounded-xl font-bold text-sm border-2 shadow-[0_3px_0_#cbd5e1] text-left ${
                                                    selectedItem === item.id
                                                        ? 'bg-brand-yellow border-yellow-600 text-yellow-950 scale-105'
                                                        : 'bg-white border-slate-300 text-slate-800 hover:bg-blue-50'
                                                }`}
                                            >
                                                {item.text}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="flex flex-col sm:flex-row gap-3">
                                <button type="button" onClick={handleReset} className="sm:w-1/3 btn-3d bg-slate-200 text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#94a3b8] py-3.5">
                                    🔄 RESET
                                </button>
                                <button type="button" onClick={handleCheck} className="sm:w-2/3 btn-3d btn-primary py-3.5 text-lg">
                                    ✅ CHECK ANSWERS
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // =========================================================================
        // 12. STAGE 3: GRAMMAR DETECTIVE (TOPIC-ALIGNED, MULTIPLAYER SYNCED & FINAL BOSS)
        // =========================================================================
        const ScreenGrammar = ({
            data,
            title = "Grammar Detective",
            world = null,
            onBack,
            onComplete,
            showModal,
            syncedUpdate,
            onBroadcastActivity,
            isFinal = false
        }) => {
            const [currentQ, setCurrentQ] = useState(0);
            const expectedWorldId = isFinal ? 'final' : (world ? world.id : null);

            useEffect(() => { setCurrentQ(0); }, [data]);

            useEffect(() => {
                if (syncedUpdate && syncedUpdate.worldId === expectedWorldId && syncedUpdate.data) {
                    if (typeof syncedUpdate.data.nextQ === 'number' && syncedUpdate.data.nextQ < data.length) {
                        setCurrentQ(syncedUpdate.data.nextQ);
                    }
                }
            }, [syncedUpdate, expectedWorldId, data.length]);

            const handleAnswer = (index) => {
                const q = data[currentQ];
                if (index === q.correct) {
                    const isLast = currentQ >= data.length - 1;
                    if (onBroadcastActivity && !isLast) {
                        onBroadcastActivity(
                            { nextQ: currentQ + 1 },
                            `answered Q${currentQ + 1} correctly ("${q.options[index]}")!`
                        );
                    }
                    showModal("Correct! 🎯", q.exp || "Great grammar detective work!", "success", () => {
                        if (!isLast) setCurrentQ(prev => prev + 1);
                        else onComplete();
                    });
                } else {
                    showModal("Not Quite ❌", `Hint: ${q.exp || "Check the subject and verb agreement!"}`, "error");
                }
            };

            const q = data[currentQ];

            return (
                <div className={`flex-1 p-4 md:p-6 flex flex-col items-center justify-center ${isFinal ? 'bg-gradient-to-b from-red-900 to-slate-900' : (world ? world.themeBg : 'bg-slate-800')}`}>
                    <div className="w-full max-w-2xl mb-4 flex justify-between items-center">
                        <button type="button" onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#cbd5e1] px-3 py-1.5 text-xs">
                            ⬅️ Back
                        </button>
                        <span className={`font-black text-sm ${isFinal ? 'text-yellow-300' : 'text-slate-700'}`}>
                            {currentQ + 1} / {data.length}
                        </span>
                    </div>

                    <div className="game-card w-full max-w-2xl p-6 md:p-8 animate-pop">
                        <div className="text-center mb-4">
                            <span className="text-4xl">{isFinal ? '👑' : '🔍'}</span>
                            <div className="text-xs font-black uppercase text-brand-purple mt-1">{title}</div>
                        </div>

                        {world && (
                            <div className="max-w-xs mx-auto mb-5">
                                <TopicIllustration topicId={world.id} className="w-full h-36 rounded-xl" />
                            </div>
                        )}

                        <h3 className="text-xl md:text-2xl font-black text-slate-800 mb-6 text-center">{q.q}</h3>
                        <div className="space-y-3">
                            {q.options.map((opt, i) => (
                                <button type="button" key={i} onClick={() => handleAnswer(i)} className="w-full btn-3d btn-secondary py-3.5 text-left px-5 text-base md:text-lg justify-start">
                                    <span className="bg-white/70 text-blue-900 w-8 h-8 rounded-full inline-flex items-center justify-center mr-3 font-black shrink-0">
                                        {String.fromCharCode(65 + i)}
                                    </span>
                                    <span className="normal-case">{opt}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // =========================================================================
        // 13. STAGE 4: SENTENCE BUILDER (MULTIPLAYER SYNCED)
        // =========================================================================
        const ScreenSentenceBuilder = ({ world, onBack, onComplete, showModal, syncedUpdate, onBroadcastActivity }) => {
            const data = world.sentences;
            const [currentQ, setCurrentQ] = useState(0);
            const [selectedWords, setSelectedWords] = useState([]);
            const [availableWords, setAvailableWords] = useState([]);

            const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);

            useEffect(() => {
                setCurrentQ(0);
            }, [world.id]);

            useEffect(() => {
                setAvailableWords(shuffle(data[currentQ].words));
                setSelectedWords([]);
            }, [currentQ, data]);

            useEffect(() => {
                if (syncedUpdate && syncedUpdate.worldId === world.id && syncedUpdate.data) {
                    const { qIdx, sel, avail } = syncedUpdate.data;
                    if (typeof qIdx === 'number' && qIdx < data.length && qIdx !== currentQ) {
                        setCurrentQ(qIdx);
                    } else if (Array.isArray(sel) && Array.isArray(avail)) {
                        setSelectedWords(sel);
                        setAvailableWords(avail);
                    }
                }
            }, [syncedUpdate, world.id, data.length, currentQ]);

            const handleSelect = (word, index) => {
                const nextSel = [...selectedWords, word];
                const nextAvail = availableWords.filter((_, i) => i !== index);
                setSelectedWords(nextSel);
                setAvailableWords(nextAvail);
                if (onBroadcastActivity) {
                    onBroadcastActivity({ qIdx: currentQ, sel: nextSel, avail: nextAvail }, `added "${word}"`);
                }
            };

            const handleDeselect = (word, index) => {
                const nextAvail = [...availableWords, word];
                const nextSel = selectedWords.filter((_, i) => i !== index);
                setAvailableWords(nextAvail);
                setSelectedWords(nextSel);
                if (onBroadcastActivity) {
                    onBroadcastActivity({ qIdx: currentQ, sel: nextSel, avail: nextAvail }, `removed "${word}"`);
                }
            };

            const handleCheck = () => {
                const answer = selectedWords.join(" ");
                if (answer === data[currentQ].correct) {
                    const isLast = currentQ >= data.length - 1;
                    if (onBroadcastActivity && !isLast) {
                        onBroadcastActivity({ qIdx: currentQ + 1 }, `built "${answer}"!`);
                    }
                    showModal("Amazing! ⭐", `Correct sentence:\n"${answer}"`, "success", () => {
                        if (!isLast) setCurrentQ(q => q + 1);
                        else onComplete();
                    });
                } else {
                    showModal("Not Quite! 🚧", "Check the word order carefully and try again.", "error");
                }
            };

            return (
                <div className={`flex-1 p-4 md:p-6 ${world.themeBg} flex flex-col items-center justify-center`}>
                    <div className="w-full max-w-3xl mb-3 flex justify-between items-center">
                        <button type="button" onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#cbd5e1] px-3 py-1.5 text-xs">
                            ⬅️ Back to {world.name}
                        </button>
                        <span className="font-black text-slate-600 text-sm">Sentence {currentQ + 1} / {data.length}</span>
                    </div>

                    <div className="game-card w-full max-w-3xl p-6 md:p-8 animate-pop">
                        <div className="text-center mb-4">
                            <span className={`inline-block text-xs font-black px-3 py-1 rounded-full border mb-2 ${world.badgeColor}`}>
                                🧩 Sentence Builder • {world.subjectTitle}
                            </span>
                            <h2 className="text-2xl md:text-3xl font-black text-brand-deep">Arrange the Words!</h2>
                        </div>

                        <div className="max-w-xs mx-auto mb-5">
                            <TopicIllustration topicId={world.id} className="w-full h-36 rounded-xl" />
                        </div>

                        {/* Drop Zone */}
                        <div className="bg-slate-100 rounded-2xl min-h-[96px] p-4 flex flex-wrap gap-2 mb-6 border-4 border-dashed border-slate-300 items-center justify-center">
                            {selectedWords.length === 0 && <span className="text-slate-400 font-bold text-sm">Tap words below to build a sentence...</span>}
                            {selectedWords.map((word, i) => (
                                <button type="button" key={`sel-${i}`} onClick={() => handleDeselect(word, i)}
                                    className="bg-brand-yellow text-yellow-950 font-black px-4 py-2 rounded-xl shadow-[0_4px_0_#ca8a04] hover:bg-yellow-300 text-base md:text-lg">
                                    {word}
                                </button>
                            ))}
                        </div>

                        {/* Word Bank */}
                        <div className="flex flex-wrap gap-3 justify-center mb-8">
                            {availableWords.map((word, i) => (
                                <button type="button" key={`avail-${i}`} onClick={() => handleSelect(word, i)}
                                    className="bg-white text-slate-800 font-black px-4 py-2 rounded-xl border-2 border-slate-300 shadow-[0_4px_0_#cbd5e1] hover:bg-blue-50 text-base md:text-lg">
                                    {word}
                                </button>
                            ))}
                        </div>

                        <div className="flex gap-4">
                            <button type="button" onClick={() => { setAvailableWords(shuffle(data[currentQ].words)); setSelectedWords([]); }}
                                className="flex-1 btn-3d bg-slate-200 text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#94a3b8] py-3.5">
                                🔄 RESET
                            </button>
                            <button type="button" onClick={handleCheck} disabled={availableWords.length > 0} className="flex-[2] btn-3d btn-primary py-3.5 text-lg">
                                ✅ CHECK ANSWER
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // =========================================================================
        // 14. STAGE 5: WRITING BUILDER (MULTIPLAYER SYNCED)
        // =========================================================================
        const ScreenWritingBuilder = ({ world, showModal, syncedUpdate, onBroadcastActivity, onBack, onSaveWriting, onComplete }) => {
            const [paragraphText, setParagraphText] = useState(world.identificationIntro + " ");
            const [usedIds, setUsedIds] = useState([]);
            const [showModel, setShowModel] = useState(false);

            useEffect(() => {
                setParagraphText(world.identificationIntro + " ");
                setUsedIds([]);
                setShowModel(false);
            }, [world.id]);

            useEffect(() => {
                if (syncedUpdate && syncedUpdate.worldId === world.id && syncedUpdate.data) {
                    if (typeof syncedUpdate.data.text === 'string') {
                        setParagraphText(syncedUpdate.data.text);
                    }
                    if (Array.isArray(syncedUpdate.data.usedIds)) {
                        setUsedIds(syncedUpdate.data.usedIds);
                    }
                }
            }, [syncedUpdate, world.id]);

            const addSentenceToBox = (item) => {
                const trimmed = paragraphText.trim();
                const nextText = trimmed ? `${trimmed} ${item.text}` : item.text;
                const nextUsed = usedIds.includes(item.id) ? usedIds : [...usedIds, item.id];
                setParagraphText(nextText);
                setUsedIds(nextUsed);
                if (onBroadcastActivity) {
                    onBroadcastActivity({ text: nextText, usedIds: nextUsed }, `added a sentence to the paragraph`);
                }
            };

            const handleDropIntoParagraph = (e) => {
                e.preventDefault();
                const itemId = e.dataTransfer.getData('text/plain');
                const found = world.sortItems.find(i => i.id === itemId);
                if (found) addSentenceToBox(found);
            };

            const wordCount = paragraphText.trim().split(/\s+/).filter(Boolean).length;

            const handleCheckAndSubmit = () => {
                if (wordCount < 20) {
                    showModal(
                        "Add More Details! ✍️",
                        "Click or drag more phrases from each category group into the paragraph box (at least 20 words).",
                        "info"
                    );
                    return;
                }

                const lower = paragraphText.toLowerCase();
                const hasBe = /\b(is|am|are)\b/.test(lower);
                const hasHave = /\b(has|have|feel|swim|surf|located)\b/.test(lower);

                onSaveWriting(paragraphText);
                showModal(
                    "Wonderful Paragraph! 🌟",
                    `Great job composing a complete descriptive paragraph about ${world.subjectTitle}!\n\nWord count: ${wordCount} words\nGrammar check: ${hasBe && hasHave ? 'Uses To Be & Descriptive Verbs!' : 'Good start!'}\n\nNote: Your final writing is saved and ready for teacher feedback.`,
                    "success",
                    onComplete
                );
            };

            const handleDownload = () => {
                const blob = new Blob([`${world.subjectTitle}\n\n${paragraphText}`], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Descriptive_Text_${world.id}.txt`;
                a.click();
                URL.revokeObjectURL(url);
            };

            return (
                <div className={`flex-1 p-4 md:p-6 ${world.themeBg} overflow-y-auto`}>
                    <div className="max-w-5xl mx-auto">
                        <div className="flex flex-wrap justify-between items-center gap-2 mb-4">
                            <button type="button" onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#cbd5e1] px-4 py-2 text-xs md:text-sm">
                                ⬅️ Back to {world.name}
                            </button>
                            <button
                                type="button"
                                onClick={() => setShowModel(!showModel)}
                                className="btn-3d btn-purple px-4 py-2 text-xs"
                            >
                                {showModel ? '🙈 Hide Model Text' : '👀 View PPT Model Text'}
                            </button>
                        </div>

                        <div className="game-card p-5 md:p-7 animate-pop space-y-6">
                            <div className="flex flex-col md:flex-row items-center gap-5">
                                <div className="w-full md:w-52 shrink-0">
                                    <TopicIllustration topicId={world.id} className="w-full h-36 rounded-xl" />
                                </div>
                                <div>
                                    <span className={`inline-block text-xs font-black px-3 py-1 rounded-full border mb-1 ${world.badgeColor}`}>
                                        ✍️ Writing Builder • {world.subjectTitle}
                                    </span>
                                    <h2 className="text-2xl md:text-3xl font-black text-brand-deep">Build Your Full Paragraph!</h2>
                                    <p className="text-sm font-bold text-slate-600 mt-1">
                                        Click or drag sentences from the categorized groups below into the <strong>Paragraph Box</strong> to create one complete descriptive text. You can also edit and add your own sentences!
                                    </p>
                                </div>
                            </div>

                            {showModel && (
                                <div className="bg-purple-50 border-2 border-purple-200 rounded-2xl p-4 text-sm font-semibold text-purple-950">
                                    <div className="font-black text-purple-800 mb-1">📖 PPT Model Example ({world.subjectTitle}):</div>
                                    <p className="whitespace-pre-line">{world.modelText.identification} {world.modelText.description}</p>
                                </div>
                            )}

                            <div className={`grid grid-cols-1 ${world.categories.length === 3 ? 'md:grid-cols-3' : 'md:grid-cols-2'} gap-4`}>
                                {world.categories.map(cat => (
                                    <div key={cat.id} className={`rounded-2xl border-2 overflow-hidden ${cat.color}`}>
                                        <div className={`${cat.headerBg} text-white font-black px-4 py-2 text-sm flex items-center gap-2`}>
                                            <span>{cat.icon}</span> {cat.label} (Click or Drag)
                                        </div>
                                        <div className="p-3 flex flex-wrap gap-2">
                                            {world.sortItems.filter(i => i.category === cat.id).map(item => {
                                                const isUsed = usedIds.includes(item.id);
                                                return (
                                                    <button
                                                        key={item.id}
                                                        type="button"
                                                        draggable
                                                        onDragStart={(e) => e.dataTransfer.setData('text/plain', item.id)}
                                                        onClick={() => addSentenceToBox(item)}
                                                        className={`drag-chip text-xs font-bold px-3 py-1.5 rounded-xl border-2 text-left transition ${
                                                            isUsed
                                                                ? 'bg-green-100 border-green-400 text-green-900'
                                                                : 'bg-white border-slate-200 text-slate-800 hover:border-brand-sky hover:bg-blue-50'
                                                        }`}
                                                    >
                                                        {isUsed ? '✅ ' : '+ '}{item.text}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div
                                onDragOver={(e) => e.preventDefault()}
                                onDrop={handleDropIntoParagraph}
                                className="bg-blue-50/70 rounded-2xl p-4 border-4 border-dashed border-brand-sky"
                            >
                                <div className="flex justify-between items-center mb-2">
                                    <label className="font-black text-brand-deep text-base">
                                        📄 Your Complete Descriptive Paragraph ({world.subjectTitle})
                                    </label>
                                    <span className="bg-white px-3 py-1 rounded-full text-xs font-black text-slate-600 border border-slate-200">
                                        Words: {wordCount}
                                    </span>
                                </div>
                                <textarea
                                    rows="6"
                                    value={paragraphText}
                                    onChange={(e) => {
                                        const val = e.target.value;
                                        setParagraphText(val);
                                        if (onBroadcastActivity) {
                                            onBroadcastActivity({ text: val, usedIds }, null);
                                        }
                                    }}
                                    placeholder="Drag or click phrases above to assemble your paragraph here..."
                                    className="w-full p-4 rounded-xl border-2 border-slate-300 focus:border-brand-deep focus:outline-none font-semibold text-slate-800 text-base leading-relaxed bg-white"
                                />
                            </div>

                            <div className="flex flex-wrap gap-3 justify-between">
                                <div className="flex gap-2">
                                    <button
                                        type="button"
                                        onClick={() => { setParagraphText(world.identificationIntro + " "); setUsedIds([]); }}
                                        className="btn-3d bg-slate-200 text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#94a3b8] px-4 py-3 text-sm"
                                    >
                                        🔄 Reset
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleDownload}
                                        className="btn-3d btn-secondary px-4 py-3 text-sm"
                                    >
                                        ⬇️ Download (.txt)
                                    </button>
                                </div>
                                <button type="button" onClick={handleCheckAndSubmit} className="btn-3d btn-primary px-8 py-3 text-base flex-1 sm:flex-none">
                                    ✅ CHECK & SAVE PARAGRAPH (+50 Pts)
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // =========================================================================
        // 15. BASE CAMP MATERIALS, TEAM PROJECT, REFLECTION, ACHIEVEMENTS, DASHBOARD
        // =========================================================================
        const ScreenMaterial = ({ data, onBack, onComplete }) => (
            <div className="flex-1 p-4 md:p-8 bg-brand-sky flex flex-col items-center justify-center">
                <div className="w-full max-w-2xl mb-3">
                    <button type="button" onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#cbd5e1] px-4 py-1.5 text-xs">
                        ⬅️ Back to Map
                    </button>
                </div>
                <div className="game-card max-w-2xl w-full p-8 animate-pop">
                    <div className="text-center mb-6">
                        <span className="text-6xl">{data.icon}</span>
                        <h2 className="text-3xl font-black text-brand-deep mt-4">{data.title}</h2>
                    </div>
                    <div className="bg-blue-50 border-l-4 border-blue-500 p-6 rounded-r-2xl mb-6">
                        <p className="text-xl text-slate-800 font-bold mb-4">{data.content}</p>
                        {data.function && (
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-blue-100">
                                <span className="font-black text-blue-700 block mb-1">🎯 Social Function:</span>
                                <p className="text-slate-700 font-semibold">{data.function}</p>
                            </div>
                        )}
                    </div>
                    <button type="button" onClick={onComplete} className="w-full btn-3d btn-primary py-4 text-xl">UNDERSTOOD! (+10 Pts)</button>
                </div>
            </div>
        );

        const ScreenStructure = ({ data, onBack, onComplete }) => (
            <div className="flex-1 p-4 md:p-8 bg-brand-teal flex flex-col items-center">
                <div className="w-full max-w-3xl mb-3">
                    <button type="button" onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#cbd5e1] px-4 py-1.5 text-xs">
                        ⬅️ Back to Map
                    </button>
                </div>
                <div className="game-card max-w-3xl w-full p-6 md:p-8 animate-pop mb-4">
                    <h2 className="text-3xl font-black text-teal-900 text-center mb-6">{data.icon} {data.title}</h2>
                    <div className="space-y-6">
                        {data.parts.map((part, i) => (
                            <div key={i} className="bg-white rounded-2xl border-2 border-teal-200 p-4 shadow-sm relative overflow-hidden">
                                <div className={`absolute top-0 left-0 w-2 h-full ${i === 0 ? 'bg-orange-400' : 'bg-blue-400'}`}></div>
                                <h3 className={`text-xl font-black mb-2 pl-4 ${i === 0 ? 'text-orange-600' : 'text-blue-600'}`}>{part.name}</h3>
                                <p className="text-slate-600 font-bold mb-3 pl-4">{part.desc}</p>
                                <div className="bg-slate-100 p-3 rounded-xl ml-4 font-mono text-sm border border-slate-200">
                                    <span className="text-slate-400 select-none">Example: </span>
                                    <span className={i === 0 ? 'text-orange-700 font-bold' : 'text-blue-700 font-bold'}>{part.example}</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
                <button type="button" onClick={onComplete} className="w-full max-w-3xl btn-3d btn-primary py-4 text-xl">GOT IT! (+10 Pts)</button>
            </div>
        );

        const ScreenLangFeatures = ({ data, onBack, onComplete }) => {
            const [activeTab, setActiveTab] = useState(0);
            return (
                <div className="flex-1 p-4 md:p-8 bg-brand-purple flex flex-col items-center">
                    <div className="w-full max-w-3xl mb-3">
                        <button type="button" onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#cbd5e1] px-4 py-1.5 text-xs">
                            ⬅️ Back to Map
                        </button>
                    </div>
                    <div className="game-card max-w-3xl w-full p-6 animate-pop mb-4 flex flex-col">
                        <h2 className="text-3xl font-black text-purple-900 text-center mb-6">{data.icon} {data.title}</h2>
                        <div className="flex flex-wrap gap-2 mb-6 justify-center">
                            {data.features.map((feat, i) => (
                                <button type="button" key={i} onClick={() => setActiveTab(i)}
                                    className={`px-4 py-2 rounded-xl font-bold border-2 transition-all ${activeTab === i ? 'bg-purple-600 text-white border-purple-800 shadow-inner' : 'bg-purple-50 text-purple-700 border-purple-200 hover:bg-purple-100'}`}>
                                    {feat.title}
                                </button>
                            ))}
                        </div>
                        <div className="bg-slate-50 rounded-2xl border-2 border-slate-200 p-6 flex flex-col items-center justify-center min-h-[200px]">
                            <h3 className="text-xl font-black text-slate-800 mb-4">{data.features[activeTab].title} Examples:</h3>
                            <ul className="space-y-3 w-full max-w-md">
                                {data.features[activeTab].examples.map((ex, i) => (
                                    <li key={i} className="bg-white p-3 rounded-xl shadow-sm border border-slate-200 font-bold text-base text-center text-purple-900">
                                        {ex}
                                    </li>
                                ))}
                            </ul>
                        </div>
                    </div>
                    <button type="button" onClick={onComplete} className="w-full max-w-3xl btn-3d btn-primary py-4 text-xl">READY TO EXPLORE! (+10 Pts)</button>
                </div>
            );
        };

        const ScreenTeamProject = ({ user, showModal, onBack, onComplete }) => {
            const [topic, setTopic] = useState('place');
            const [title, setTitle] = useState('');
            const [text, setText] = useState('');
            const [posterMode, setPosterMode] = useState(false);

            return (
                <div className="flex-1 p-4 md:p-6 bg-brand-purple flex flex-col items-center overflow-y-auto">
                    <div className="w-full max-w-4xl mb-3">
                        <button type="button" onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#cbd5e1] px-4 py-1.5 text-xs">
                            ⬅️ Back to Map
                        </button>
                    </div>

                    <div className="game-card max-w-4xl w-full p-6 animate-pop">
                        <div className="text-center mb-5 border-b-2 border-slate-100 pb-4">
                            <span className="text-4xl">🤝</span>
                            <h2 className="text-2xl md:text-3xl font-black text-brand-deep mt-1">MY AMAZING DESCRIPTION PROJECT</h2>
                            <p className="font-bold text-slate-500 text-sm">
                                Group: {user.groupName || 'Explorer Team'} {user.members ? `• Members: ${user.members}` : ''}
                            </p>
                        </div>

                        {posterMode ? (
                            <div className="bg-gradient-to-br from-blue-50 via-white to-amber-50 p-6 rounded-3xl border-4 border-brand-yellow shadow-xl text-center space-y-4">
                                <span className="inline-block bg-brand-deep text-white font-black px-4 py-1 rounded-full text-xs uppercase">
                                    DIGITAL POSTER • {user.groupName || 'GROUP PROJECT'}
                                </span>
                                <h3 className="text-3xl font-black text-brand-deep">{title || WORLDS_DATA[topic].subjectTitle}</h3>
                                <div className="max-w-sm mx-auto">
                                    <TopicIllustration topicId={topic} className="w-full h-44 rounded-2xl shadow-md" />
                                </div>
                                <p className="text-left bg-white p-5 rounded-2xl border-2 border-slate-200 font-semibold text-slate-700 whitespace-pre-line leading-relaxed">
                                    {text || "Your group description will appear here!"}
                                </p>
                                <button type="button" onClick={() => setPosterMode(false)} className="btn-3d btn-secondary px-6 py-2.5 text-sm">
                                    ✏️ Edit Project
                                </button>
                            </div>
                        ) : (
                            <div className="space-y-5">
                                <div className="bg-purple-50 p-4 rounded-2xl border-2 border-purple-200">
                                    <h3 className="font-black text-purple-900 mb-2 text-sm">Team Roles:</h3>
                                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 text-xs font-bold text-purple-800">
                                        <div className="bg-white p-2 rounded-lg text-center">👀 Observer</div>
                                        <div className="bg-white p-2 rounded-lg text-center">📝 Vocab Hunter</div>
                                        <div className="bg-white p-2 rounded-lg text-center">✍️ Sentence Creator</div>
                                        <div className="bg-white p-2 rounded-lg text-center">🔍 Grammar Checker</div>
                                        <div className="bg-white p-2 rounded-lg text-center">🎤 Presenter</div>
                                    </div>
                                </div>

                                <div>
                                    <label className="block font-black text-slate-700 text-sm mb-2">Choose Category:</label>
                                    <div className="flex flex-wrap gap-2">
                                        {Object.values(WORLDS_DATA).map(w => (
                                            <button type="button" key={w.id} onClick={() => setTopic(w.id)}
                                                className={`px-4 py-2 rounded-xl font-bold text-sm border-2 ${topic === w.id ? 'bg-brand-yellow border-yellow-600 text-yellow-950' : 'bg-slate-50 border-slate-200 text-slate-600'}`}>
                                                {w.icon} {w.name}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <label className="block font-black text-slate-700 text-sm mb-1">Project Title:</label>
                                    <input type="text" value={title} onChange={e => setTitle(e.target.value)}
                                        placeholder={`e.g. ${WORLDS_DATA[topic].subjectTitle}`}
                                        className="w-full bg-slate-50 border-2 border-slate-300 rounded-xl p-3 font-bold focus:border-purple-500 focus:outline-none" />
                                </div>

                                <div>
                                    <label className="block font-black text-slate-700 text-sm mb-1">Collaborative Descriptive Text:</label>
                                    <textarea rows="5" value={text} onChange={e => setText(e.target.value)}
                                        placeholder="Work together to write your Identification and Description here..."
                                        className="w-full p-4 rounded-2xl border-2 border-slate-300 focus:border-purple-500 focus:outline-none font-semibold text-slate-800" />
                                </div>

                                <div className="flex flex-col sm:flex-row gap-3">
                                    <button type="button" onClick={() => setPosterMode(true)} className="sm:w-1/2 btn-3d btn-secondary py-3.5 text-base">
                                        🖼️ PRESENTATION MODE
                                    </button>
                                    <button type="button" onClick={() => {
                                        if (text.trim().length < 20) return showModal("Too Short", "Write at least 2 sentences for your group project!", "info");
                                        try { localStorage.setItem('dta_draft_team', text); } catch (e) {}
                                        showModal("Project Saved! 🌟", "Great teamwork! (+50 pts)", "success", () => onComplete(50));
                                    }} className="sm:w-1/2 btn-3d btn-primary py-3.5 text-base">
                                        💾 SAVE PROJECT (+50 Pts)
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const ScreenReflection = ({ onComplete }) => {
            const [conf, setConf] = useState('');
            const [note, setNote] = useState('');
            return (
                <div className="flex-1 p-4 bg-brand-deep flex items-center justify-center">
                    <div className="game-card max-w-2xl w-full p-8 animate-pop">
                        <h2 className="text-3xl font-black text-brand-deep text-center mb-6">🤔 LET'S REFLECT</h2>
                        <div className="space-y-6 mb-8">
                            <div>
                                <p className="font-bold text-lg text-slate-700 mb-3">Are you confident in writing descriptive text about People, Animals, Things, and Place now?</p>
                                <div className="flex flex-col sm:flex-row gap-3">
                                    {['Very confident', 'Confident', 'Need more practice'].map(lvl => (
                                        <button type="button" key={lvl} onClick={() => setConf(lvl)}
                                            className={`flex-1 py-3 rounded-xl border-2 font-bold transition-all ${conf === lvl ? 'bg-brand-sky border-blue-500 text-white shadow-inner' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>
                                            {lvl}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div>
                                <label className="block font-bold text-slate-700 mb-2">What was your favorite world or activity today?</label>
                                <textarea rows="3" value={note} onChange={e => setNote(e.target.value)}
                                    placeholder="Write a short reflection..."
                                    className="w-full p-3 rounded-xl border-2 border-slate-300 focus:border-brand-sky focus:outline-none font-semibold" />
                            </div>
                        </div>
                        <button type="button" onClick={() => onComplete({ confidence: conf, note })} disabled={!conf} className="w-full btn-3d btn-primary py-4 text-xl">
                            FINISH ADVENTURE 🏆
                        </button>
                    </div>
                </div>
            );
        };

        const ScreenAchievements = ({ progress, user, onRestart }) => (
            <div className="flex-1 p-6 bg-gradient-to-b from-brand-deep to-slate-900 flex flex-col items-center justify-center text-center overflow-y-auto">
                <div className="animate-float mb-3 text-6xl">🏆</div>
                <h1 className="text-4xl md:text-6xl font-black text-brand-yellow mb-2 drop-shadow-md">CONGRATULATIONS!</h1>
                <p className="text-xl md:text-2xl text-white font-bold mb-8">You are a Descriptive Text Detective, {user.name || 'Explorer'}!</p>

                <div className="bg-white/10 backdrop-blur-md p-6 rounded-3xl border border-white/20 mb-8 flex gap-8 w-full max-w-md justify-center">
                    <div className="text-center">
                        <div className="text-xs text-brand-sky font-bold uppercase mb-1">Total Points</div>
                        <div className="text-4xl font-black text-brand-yellow flex items-center gap-2"><IconCoin className="w-8 h-8" /> {progress.points}</div>
                    </div>
                    <div className="w-px bg-white/20"></div>
                    <div className="text-center">
                        <div className="text-xs text-brand-sky font-bold uppercase mb-1">Stars Earned</div>
                        <div className="text-4xl font-black text-brand-orange flex items-center gap-2"><IconStar className="w-8 h-8" /> {progress.stars}</div>
                    </div>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-8 max-w-2xl w-full">
                    {[
                        { icon: '👩‍🎓', name: 'People Master', check: progress.completed.some(c => c.startsWith('people_')) },
                        { icon: '🐈', name: 'Animal Master', check: progress.completed.some(c => c.startsWith('animals_')) },
                        { icon: '🚗', name: 'Things Master', check: progress.completed.some(c => c.startsWith('things_')) },
                        { icon: '🏖️', name: 'Place Explorer', check: progress.completed.some(c => c.startsWith('place_')) },
                        { icon: '🤝', name: 'Team Champion', check: progress.completed.includes('team_project') },
                        { icon: '👑', name: 'Descriptive Expert', check: progress.completed.includes('final_challenge') }
                    ].map((b, i) => (
                        <div key={i} className={`p-4 rounded-2xl border-2 bg-slate-800 border-slate-600 text-white ${b.check ? 'opacity-100 ring-2 ring-brand-yellow' : 'opacity-35'}`}>
                            <div className="text-3xl mb-1">{b.icon}</div>
                            <div className="font-bold text-xs">{b.name}</div>
                        </div>
                    ))}
                </div>

                <button type="button" onClick={onRestart} className="btn-3d bg-white text-brand-deep py-3 px-8 text-lg rounded-full">
                    🔄 Play Again
                </button>
            </div>
        );
        const ScreenTeacherDashboard = ({ currentRoomCode = DEFAULT_ROOM_CODE, onStartFocusGame, onBack }) => {
            const [data, setData] = useState([]);
            const [roomInput, setRoomInput] = useState(currentRoomCode || DEFAULT_ROOM_CODE);

            useEffect(() => {
                try {
                    const stored = localStorage.getItem('dta_teacher_data');
                    if (stored) setData(JSON.parse(stored));
                } catch (e) {}
            }, []);

            const exportCSV = () => {
                if (data.length === 0) return;
                const headers = ["Student", "Class", "Group", "Points", "Stars", "Confidence", "Date"];
                const rows = data.map(r => [
                    `"${r.user?.name || ''}"`,
                    `"${r.user?.class || ''}"`,
                    `"${r.user?.groupName || ''}"`,
                    r.progress?.points || 0,
                    r.progress?.stars || 0,
                    `"${r.reflection?.confidence || ''}"`,
                    `"${new Date(r.date).toLocaleDateString()}"`
                ].join(","));
                const csv = [headers.join(","), ...rows].join("\n");
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "descriptive_text_adventure_recap.csv";
                a.click();
                URL.revokeObjectURL(url);
            };

            return (
                <div className="flex-1 p-6 bg-slate-100 flex flex-col h-full overflow-hidden">
                    <div className="flex flex-wrap justify-between items-center gap-3 mb-6">
                        <h2 className="text-2xl md:text-3xl font-black text-slate-800">👩‍🏫 Teacher Dashboard</h2>
                        <div className="flex gap-2">
                            <button type="button" onClick={exportCSV} disabled={data.length === 0} className="btn-3d btn-success px-4 py-2 text-xs">
                                ⬇️ Download CSV
                            </button>
                            <button type="button" onClick={onBack} className="btn-3d bg-slate-300 text-slate-800 border-2 border-slate-400 shadow-[0_4px_0_#94a3b8] px-4 py-2 text-xs">
                                ⬅️ Back to Home
                            </button>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex-1 overflow-y-auto space-y-6">
                        {/* Live Teacher Focus Mode Control Box */}
                        <div className="bg-gradient-to-r from-blue-50 via-indigo-50 to-amber-50 p-5 rounded-2xl border-2 border-brand-sky shadow-sm">
                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                <div>
                                    <span className="inline-block bg-amber-400 text-amber-950 font-black px-3 py-0.5 rounded-full text-xs uppercase mb-1">
                                        🎯 Full-Sync Teacher Focus Mode
                                    </span>
                                    <h3 className="text-lg md:text-xl font-black text-brand-deep">
                                        Control All Game Menus Live With Students
                                    </h3>
                                    <p className="text-xs font-bold text-slate-600 mt-1">
                                        Every menu you open (Map, Materials, 4 Worlds, Drag & Drop, Grammar, etc.) will automatically be followed by all students in the room, and students cannot switch menus until you click <strong>🔓 Turn Off Focus Mode</strong>.
                                    </p>
                                </div>
                                <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 shrink-0">
                                    <input
                                        type="text"
                                        value={roomInput}
                                        onChange={(e) => setRoomInput(e.target.value.toUpperCase())}
                                        placeholder="Room Code (e.g. KELAS7A)"
                                        className="bg-white border-2 border-purple-300 rounded-xl px-3 py-2.5 font-black uppercase text-purple-900 text-sm w-full sm:w-36 focus:outline-none focus:border-purple-500"
                                    />
                                    <button
                                        type="button"
                                        onClick={() => onStartFocusGame && onStartFocusGame(roomInput)}
                                        className="btn-3d btn-primary px-5 py-3 text-xs sm:text-sm whitespace-nowrap"
                                    >
                                        🎮 OPEN ALL GAME MENUS (STUDENTS FOLLOW)
                                    </button>
                                </div>
                            </div>
                        </div>

                        <p className="text-xs font-bold text-amber-800 bg-amber-50 p-3 rounded-xl border border-amber-200">
                            ℹ️ Note: Student scores and writings are stored locally on this device/browser.
                        </p>

                        {data.length === 0 ? (
                            <p className="text-center text-slate-500 py-10 font-bold">No completed student sessions recorded yet.</p>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-100 text-slate-600 text-sm">
                                            <th className="p-3 border-b-2 font-black">Student</th>
                                            <th className="p-3 border-b-2 font-black">Class / Group</th>
                                            <th className="p-3 border-b-2 font-black text-center">Score</th>
                                            <th className="p-3 border-b-2 font-black">Reflection</th>
                                            <th className="p-3 border-b-2 font-black">Date</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {data.map((row, i) => (
                                            <tr key={i} className="border-b hover:bg-slate-50 text-sm">
                                                <td className="p-3 font-bold text-slate-800">{row.user?.name}</td>
                                                <td className="p-3 text-slate-600">{row.user?.class || '-'} / {row.user?.groupName || '-'}</td>
                                                <td className="p-3 text-center">
                                                    <span className="bg-green-100 text-green-700 px-2.5 py-1 rounded-full text-xs font-black">{row.progress?.points} pts</span>
                                                </td>
                                                <td className="p-3">{row.reflection?.confidence || '-'}</td>
                                                <td className="p-3 text-xs text-slate-400">{new Date(row.date).toLocaleDateString()}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- RENDER ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <SafeErrorBoundary>
                <App />
            </SafeErrorBoundary>
        );
    </script>
</body>
</html>
