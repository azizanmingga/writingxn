    <!-- Firebase Realtime Bridge (Firestore + Anonymous Auth + Local Multi-Tab Fallback) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            getFirestore, collection, doc, setDoc, getDoc, updateDoc, addDoc,
            onSnapshot, query, where, deleteDoc
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Local BroadcastChannel + localStorage fallback so multiplayer also works seamlessly across tabs without Firebase config
        const bc = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('dta_multiplayer_sync') : null;
        const localListeners = [];

        const readLocalStore = () => {
            try {
                return JSON.parse(localStorage.getItem('dta_local_mp_db') || '{"rooms":{},"players":{},"messages":{},"voice":{}}');
            } catch (e) {
                return { rooms: {}, players: {}, messages: {}, voice: {} };
            }
        };

        const writeLocalStore = (dbObj) => {
            try {
                localStorage.setItem('dta_local_mp_db', JSON.stringify(dbObj));
                if (bc) bc.postMessage({ type: 'SYNC', ts: Date.now() });
                localListeners.forEach(fn => fn());
            } catch (e) {}
        };

        if (bc) {
            bc.onmessage = () => localListeners.forEach(fn => fn());
        }
        window.addEventListener('storage', (e) => {
            if (e.key === 'dta_local_mp_db') localListeners.forEach(fn => fn());
        });

        const localUid = (() => {
            try {
                let id = sessionStorage.getItem('dta_local_uid');
                if (!id) {
                    id = 'u_' + Math.random().toString(36).slice(2, 10);
                    sessionStorage.setItem('dta_local_uid', id);
                }
                return id;
            } catch (e) {
                return 'u_' + Math.random().toString(36).slice(2, 10);
            }
        })();

        const bridge = {
            available: false,
            ready: false,
            mode: 'local',
            uid: localUid,
            appId: typeof __app_id !== 'undefined' ? __app_id : 'dta-multiplayer-v1',
            db: null,
            auth: null,
            pubCollection(name) {
                return collection(this.db, 'artifacts', this.appId, 'public', 'data', name);
            },
            pubDoc(name, id) {
                return doc(this.db, 'artifacts', this.appId, 'public', 'data', name, id);
            },
            setDoc, getDoc, updateDoc, addDoc, onSnapshot, query, where, deleteDoc,
            // Unified Local + Cloud Helpers
            async upsertRoom(roomCode, data) {
                if (this.available && this.mode === 'firebase') {
                    await setDoc(this.pubDoc('dta_rooms', roomCode), data, { merge: true });
                } else {
                    const dbObj = readLocalStore();
                    dbObj.rooms[roomCode] = { ...(dbObj.rooms[roomCode] || {}), ...data };
                    writeLocalStore(dbObj);
                }
            },
            async fetchRoom(roomCode) {
                if (this.available && this.mode === 'firebase') {
                    const snap = await getDoc(this.pubDoc('dta_rooms', roomCode));
                    return snap.exists() ? snap.data() : null;
                } else {
                    const dbObj = readLocalStore();
                    return dbObj.rooms[roomCode] || null;
                }
            },
            async upsertPlayer(roomCode, playerId, data) {
                if (this.available && this.mode === 'firebase') {
                    await setDoc(this.pubDoc('dta_players', `${roomCode}_${playerId}`), { ...data, roomCode, uid: playerId }, { merge: true });
                } else {
                    const dbObj = readLocalStore();
                    if (!dbObj.players[roomCode]) dbObj.players[roomCode] = {};
                    dbObj.players[roomCode][playerId] = { ...(dbObj.players[roomCode][playerId] || {}), ...data, roomCode, uid: playerId };
                    writeLocalStore(dbObj);
                }
            },
            async sendChat(roomCode, msg) {
                const payload = { ...msg, roomCode, id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), createdAt: Date.now() };
                if (this.available && this.mode === 'firebase') {
                    await addDoc(this.pubCollection('dta_chat'), payload);
                } else {
                    const dbObj = readLocalStore();
                    if (!dbObj.messages[roomCode]) dbObj.messages[roomCode] = [];
                    dbObj.messages[roomCode].push(payload);
                    if (dbObj.messages[roomCode].length > 80) dbObj.messages[roomCode].shift();
                    writeLocalStore(dbObj);
                }
            },
            async sendVoice(roomCode, voicePayload) {
                const payload = { ...voicePayload, roomCode, id: 'v_' + Date.now(), createdAt: Date.now() };
                if (this.available && this.mode === 'firebase') {
                    await addDoc(this.pubCollection('dta_voice'), payload);
                } else {
                    const dbObj = readLocalStore();
                    if (!dbObj.voice[roomCode]) dbObj.voice[roomCode] = [];
                    dbObj.voice[roomCode].push(payload);
                    if (dbObj.voice[roomCode].length > 15) dbObj.voice[roomCode].shift();
                    writeLocalStore(dbObj);
                }
            },
            subscribeRoom(roomCode, onRoom, onPlayers, onMessages, onVoice) {
                if (this.available && this.mode === 'firebase') {
                    const u1 = onSnapshot(this.pubDoc('dta_rooms', roomCode), (snap) => {
                        onRoom(snap.exists() ? snap.data() : null);
                    });
                    const u2 = onSnapshot(query(this.pubCollection('dta_players'), where('roomCode', '==', roomCode)), (snap) => {
                        onPlayers(snap.docs.map(d => d.data()));
                    });
                    const u3 = onSnapshot(query(this.pubCollection('dta_chat'), where('roomCode', '==', roomCode)), (snap) => {
                        const list = snap.docs.map(d => d.data()).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                        onMessages(list);
                    });
                    const u4 = onSnapshot(query(this.pubCollection('dta_voice'), where('roomCode', '==', roomCode)), (snap) => {
                        const list = snap.docs.map(d => d.data()).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                        onVoice(list);
                    });
                    return () => { u1(); u2(); u3(); u4(); };
                } else {
                    const emit = () => {
                        const dbObj = readLocalStore();
                        onRoom(dbObj.rooms[roomCode] || null);
                        onPlayers(Object.values(dbObj.players[roomCode] || {}));
                        onMessages((dbObj.messages[roomCode] || []).sort((a, b) => a.createdAt - b.createdAt));
                        onVoice((dbObj.voice[roomCode] || []).sort((a, b) => a.createdAt - b.createdAt));
                    };
                    localListeners.push(emit);
                    emit();
                    return () => {
                        const idx = localListeners.indexOf(emit);
                        if (idx >= 0) localListeners.splice(idx, 1);
                    };
                }
            }
        };

        window.FB_BRIDGE = bridge;

        (async () => {
            try {
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    const cfg = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
                    if (cfg && cfg.apiKey) {
                        const app = initializeApp(cfg);
                        bridge.db = getFirestore(app);
                        bridge.auth = getAuth(app);
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(bridge.auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(bridge.auth);
                        }
                        onAuthStateChanged(bridge.auth, (u) => {
                            if (u) {
                                bridge.uid = u.uid;
                                bridge.available = true;
                                bridge.mode = 'firebase';
                                bridge.ready = true;
                                window.dispatchEvent(new Event('fb-bridge-ready'));
                            }
                        });
                        return;
                    }
                }
            } catch (e) {
                console.warn("Firebase unavailable, using local real-time sync:", e);
            }
            bridge.available = true;
            bridge.mode = 'local';
            bridge.ready = true;
            window.dispatchEvent(new Event('fb-bridge-ready'));
        })();
    </script>

                    let step = 0;

                    const playChord = () => {
                        if (!synthCtxRef.current || synthCtxRef.current.state === 'closed') return;
                        const now = synthCtxRef.current.currentTime;
                        const notes = chords[step % chords.length];
                        notes.forEach((freq) => {
                            const osc = synthCtxRef.current.createOscillator();
                            const env = synthCtxRef.current.createGain();
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(freq, now);
                            env.gain.setValueAtTime(0.001, now);
                            env.gain.linearRampToValueAtTime(0.25, now + 0.35);
                            env.gain.exponentialRampToValueAtTime(0.001, now + 2.3);
                            osc.connect(env);
                            env.connect(master);
                            osc.start(now);
                            osc.stop(now + 2.35);
                        });
                        step++;
                    };

                    playChord();
                    synthTimerRef.current = setInterval(playChord, 2400);
                } catch (e) {}
            };

            useEffect(() => () => stopSynth(), []);

            const handleToggleMusic = (e) => {
                if (e) { e.preventDefault(); e.stopPropagation(); }
                if (isPlaying) {
                    if (audioRef.current) audioRef.current.pause();
                    stopSynth();
                    setIsPlaying(false);
                } else {
                    setIsPlaying(true);
                    if (isMuted) setIsMuted(false);
                    if (useSynthFallback) {
                        startSynthLoop();
                    } else if (audioRef.current) {
                        audioRef.current.volume = volume;
                        audioRef.current.muted = false;
                        const playPromise = audioRef.current.play();
                        if (playPromise && playPromise.catch) {
                            playPromise.catch(() => {
                                if (trackIdx < PIXABAY_BGM_TRACKS.length - 1) {
                                    setTrackIdx(prev => prev + 1);
                                } else {
                                    setUseSynthFallback(true);
                                    startSynthLoop();
                                }
                            });
                        }
                    }
                }
            };

            const handleToggleMute = (e) => {
                if (e) { e.preventDefault(); e.stopPropagation(); }
                setIsMuted(prev => !prev);
            };

            const handleAudioError = () => {
                if (!isPlayingRef.current) return;
                if (trackIdx < PIXABAY_BGM_TRACKS.length - 1) {
                    setTrackIdx(prev => prev + 1);
                } else {
                    setUseSynthFallback(true);
                    startSynthLoop();
                }
            };

            const adjustVolume = (delta, e) => {
                if (e) { e.preventDefault(); e.stopPropagation(); }
                setIsMuted(false);
                setVolume(prev => Math.max(0, Math.min(1, Math.round((prev + delta) * 100) / 100)));
            };

            const handleNextTrack = (e) => {
                if (e) { e.preventDefault(); e.stopPropagation(); }
                setUseSynthFallback(false);
                setTrackIdx(prev => (prev + 1) % PIXABAY_BGM_TRACKS.length);
            };

            const handleToggleFullscreen = (e) => {
                if (e) { e.preventDefault(); e.stopPropagation(); }
                try {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen?.();
                        setIsFullscreen(true);
                    } else {
                        document.exitFullscreen?.();
                        setIsFullscreen(false);
                    }
                } catch (err) {}
            };

            useEffect(() => {
                const onFsChange = () => setIsFullscreen(!!document.fullscreenElement);
                document.addEventListener('fullscreenchange', onFsChange);
                return () => document.removeEventListener('fullscreenchange', onFsChange);
            }, []);

            return (
                <div className="fixed top-1.5 left-1/2 -translate-x-1/2 z-[65] flex flex-col items-center gap-1">
                    <audio
                        ref={audioRef}
                        src={PIXABAY_BGM_TRACKS[trackIdx].url}
                        loop
                        preload="auto"
                        playsInline
                        crossOrigin="anonymous"
                        onError={handleAudioError}
                    />
                    <div className="bg-brand-deep/95 backdrop-blur-md text-white border-2 border-brand-sky rounded-full shadow-xl px-2.5 py-1 flex items-center gap-1.5">
                        <button
                            type="button"
                            onClick={handleToggleMusic}
                            className={`btn-3d px-2.5 py-1 text-[11px] rounded-full flex items-center gap-1 ${
                                isPlaying
                                    ? 'bg-brand-yellow text-yellow-950 border border-yellow-200 shadow-[0_3px_0_#ca8a04]'
                                    : 'bg-slate-700 text-slate-200 border border-slate-500 shadow-[0_3px_0_#334155]'
                            }`}
                            title={isPlaying ? "Jeda Musik Lofi" : "Putar Musik Lofi Pixabay"}
                        >
                            <span>{isPlaying ? '🎵' : '▶️'}</span>
                            <span className="hidden sm:inline">{isPlaying ? PIXABAY_BGM_TRACKS[trackIdx].name : 'Lofi BGM'}</span>
                        </button>

                        <button
                            type="button"
                            onClick={handleToggleMute}
                            className={`w-7 h-7 rounded-full text-xs font-black flex items-center justify-center border transition ${
                                isMuted
                                    ? 'bg-red-500/80 border-red-300 text-white'
                                    : 'bg-blue-800 hover:bg-blue-700 border-blue-400 text-white'
                            }`}
                            title={isMuted ? "Unmute Musik" : "Mute Musik"}
                        >
                            {isMuted ? '🔇' : '🔊'}
                        </button>

                        {expanded && (
                            <div className="flex items-center gap-1.5 pr-1 animate-pop">
                                <button
                                    type="button"
                                    onClick={(e) => adjustVolume(-0.1, e)}
                                    className="w-6 h-6 rounded-full bg-blue-800 hover:bg-blue-700 text-white font-black text-xs flex items-center justify-center border border-blue-500"
                                    title="Kecilkan Volume"
                                >
                                    −
                                </button>
                                <input
                                    type="range"
                                    min="0"
                                    max="1"
                                    step="0.05"
                                    value={effectiveVolume}
                                    onChange={(e) => {
                                        setIsMuted(false);
                                        setVolume(parseFloat(e.target.value));
                                    }}
                                    className="bgm-slider w-16 sm:w-20 h-1.5"
                                    aria-label="Volume Musik Lofi"
                                />
                                <button
                                    type="button"
                                    onClick={(e) => adjustVolume(0.1, e)}
                                    className="w-6 h-6 rounded-full bg-blue-800 hover:bg-blue-700 text-white font-black text-xs flex items-center justify-center border border-blue-500"
                                    title="Besarkan Volume"
                                >
                                    +
                                </button>
                                <span className="text-[10px] font-black text-brand-yellow w-7 text-right">
                                    {Math.round(effectiveVolume * 100)}%
                                </span>
                                <button
                                    type="button"
                                    onClick={handleNextTrack}
                                    className="px-2 py-0.5 rounded-full bg-indigo-700 hover:bg-indigo-600 text-[10px] font-black text-white border border-indigo-400"
                                    title="Ganti Lagu Lofi Pixabay"
                                >
                                    ⏭️
                                </button>
                            </div>
                        )}

                        <button
                            type="button"
                            onClick={(e) => { e.preventDefault(); e.stopPropagation(); setExpanded(v => !v); }}
                            className="w-6 h-6 rounded-full bg-slate-800 hover:bg-slate-700 text-brand-sky text-xs font-black flex items-center justify-center border border-slate-600"
                            title="Atur Volume & Lagu"
                        >
                            {expanded ? '✖' : '🎚️'}
                        </button>

                        <button
                            type="button"
                            onClick={handleToggleFullscreen}
                            className="w-6 h-6 rounded-full bg-slate-800 hover:bg-slate-700 text-brand-yellow text-xs font-black flex items-center justify-center border border-slate-600"
                            title={isFullscreen ? "Keluar Layar Penuh" : "Layar Penuh (Fullscreen)"}
                        >
                            {isFullscreen ? '🗗' : '⛶'}
                        </button>
                    </div>
                </div>
            );
        };

        // Walkie-Talkie Suara (Push-to-Talk) + Non-Resetting Mic Test Panel
        const WalkieTalkieControl = ({ roomCode, senderName, senderAvatar, isTeacher, voiceMuted, onToggleMute, activeSpeaker, showModal }) => {
            const [isRecording, setIsRecording] = useState(false);
            const [showMicTest, setShowMicTest] = useState(false);
            const [micStatus, setMicStatus] = useState('Siap menguji mikrofon.');
            const [micLevel, setMicLevel] = useState(0);
            const [testAudioUrl, setTestAudioUrl] = useState('');
            const [isTesting, setIsTesting] = useState(false);
            const [speechSample, setSpeechSample] = useState('');

            const mediaRecorderRef = useRef(null);
            const chunksRef = useRef([]);
            const streamRef = useRef(null);
            const testAnimRef = useRef(null);
            const testAudioCtxRef = useRef(null);
            const speechRecRef = useRef(null);

            const stopActiveStreams = () => {
                if (testAnimRef.current) {
                    cancelAnimationFrame(testAnimRef.current);
                    testAnimRef.current = null;
                }
                if (speechRecRef.current) {
                    try { speechRecRef.current.abort(); } catch (e) {}
                    speechRecRef.current = null;
                }
                if (testAudioCtxRef.current) {
                    try { testAudioCtxRef.current.close(); } catch (e) {}
                    testAudioCtxRef.current = null;
                }
                if (streamRef.current) {
                    try { streamRef.current.getTracks().forEach(t => t.stop()); } catch (e) {}
                    streamRef.current = null;
                }
            };

            useEffect(() => () => stopActiveStreams(), []);

            const startTalking = async (e) => {
                if (e) { e.preventDefault(); e.stopPropagation(); }
                if (!roomCode) {
                    showModal("Belum Terhubung Room 🎙️", "Masukkan Kode Bergabung dari guru untuk menggunakan Walkie-Talkie.", "info");
                    return;
                }
                if (isRecording) return;
                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        showModal("Mikrofon Tidak Didukung 🎙️", "Browser Anda tidak mendukung akses mikrofon.", "error");
                        return;
                    }
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    streamRef.current = stream;
                    const recorder = new MediaRecorder(stream);
                    chunksRef.current = [];
                    recorder.ondataavailable = (ev) => {
                        if (ev.data && ev.data.size > 0) chunksRef.current.push(ev.data);
                    };
                    recorder.onstop = async () => {
                        try {
                            const blob = new Blob(chunksRef.current, { type: recorder.mimeType || 'audio/webm' });
                            const reader = new FileReader();
                            reader.onloadend = async () => {
                                if (reader.result && window.FB_BRIDGE) {
                                    await window.FB_BRIDGE.sendVoice(roomCode, {
                                        senderId: window.FB_BRIDGE.uid,
                                        senderName: senderName || (isTeacher ? 'Guru' : 'Murid'),
                                        senderAvatar: senderAvatar || (isTeacher ? '👩‍🏫' : '🕵️‍♂️'),
                                        audioData: reader.result
                                    });
                                }
                            };
                            reader.readAsDataURL(blob);
                        } catch (err) {}
                        stopActiveStreams();
                    };
                    mediaRecorderRef.current = recorder;
                    recorder.start();
                    setIsRecording(true);
                } catch (err) {
                    stopActiveStreams();
                    setIsRecording(false);
                    showModal("Izin Mikrofon Ditolak 🎙️", "Aktifkan izin mikrofon di browser Anda agar bisa berbicara. Permainan tetap berjalan di posisi saat ini.", "info");
                }
            };

            const stopTalking = (e) => {
                if (e) { e.preventDefault(); e.stopPropagation(); }
                if (!isRecording) return;
                setIsRecording(false);
                try {
                    if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
                        mediaRecorderRef.current.stop();
                    } else {
                        stopActiveStreams();
                    }
                } catch (err) {
                    stopActiveStreams();
                }
            };

            const runMicTest = async (e) => {
                if (e) { e.preventDefault(); e.stopPropagation(); }
                if (isTesting) return;
                setTestAudioUrl('');
                setSpeechSample('');
                setMicStatus('Meminta izin mikrofon...');
                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        setMicStatus('❌ Browser tidak mendukung akses mikrofon.');
                        return;
                    }
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    streamRef.current = stream;
                    setIsTesting(true);
                    setMicStatus('🎙️ Bicara sekarang (uji 3 detik)...');

                    // Live volume meter
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    const ctx = new AudioCtx();
                    testAudioCtxRef.current = ctx;
                    const src = ctx.createMediaStreamSource(stream);
                    const analyser = ctx.createAnalyser();
                    analyser.fftSize = 256;
                    src.connect(analyser);
                    const dataArr = new Uint8Array(analyser.frequencyBinCount);

                    const updateMeter = () => {
                        if (!testAudioCtxRef.current) return;
                        analyser.getByteFrequencyData(dataArr);
                        const avg = dataArr.reduce((a, b) => a + b, 0) / dataArr.length;
                        setMicLevel(Math.min(100, Math.round(avg * 2)));
                        testAnimRef.current = requestAnimationFrame(updateMeter);
                    };
                    updateMeter();

                    // Optional SpeechRecognition test (safely wrapped, never resets app)
                    try {
                        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                        if (SR) {
                            const rec = new SR();
                            rec.lang = 'en-US';
                            rec.interimResults = true;
                            rec.onresult = (ev) => {
                                const text = Array.from(ev.results).map(r => r[0].transcript).join(' ');
                                setSpeechSample(text);
                            };
                            rec.onerror = () => {};
                            rec.onend = () => {};
                            speechRecRef.current = rec;
                            rec.start();
                        }
                    } catch (srErr) {}

                    // 3-second test recording playback
                    const recorder = new MediaRecorder(stream);
                    const testChunks = [];
                    recorder.ondataavailable = (ev) => { if (ev.data.size > 0) testChunks.push(ev.data); };
                    recorder.onstop = () => {
                        try {
                            const blob = new Blob(testChunks, { type: recorder.mimeType || 'audio/webm' });
                            setTestAudioUrl(URL.createObjectURL(blob));
                            setMicStatus('✅ Mikrofon berfungsi! Putar rekaman di bawah untuk cek suara.');
                        } catch (err) {
                            setMicStatus('✅ Mikrofon terdeteksi.');
                        }
                        setIsTesting(false);
                        setMicLevel(0);
                        stopActiveStreams();
                    };
                    recorder.start();
                    setTimeout(() => {
                        try {
                            if (recorder.state !== 'inactive') recorder.stop();
                        } catch (err) {}
                    }, 3000);
                } catch (err) {
                    setIsTesting(false);
                    setMicLevel(0);
                    stopActiveStreams();
                    setMicStatus('⚠️ Izin mikrofon ditolak atau perangkat tidak ditemukan. Permainan tetap aman di posisi saat ini.');
                }
            };

            return (
                <div className="flex items-center gap-1.5 relative">
                    {activeSpeaker && (
                        <div className="hidden lg:flex items-center gap-1 bg-emerald-500 text-white px-2.5 py-1 rounded-full text-[11px] font-black animate-pulse">
                            <span>🔊</span>
                            <span>{activeSpeaker.senderAvatar} {activeSpeaker.senderName} berbicara...</span>
                        </div>
                    )}

                    <button
                        type="button"
                        onMouseDown={startTalking}
                        onMouseUp={stopTalking}
                        onMouseLeave={stopTalking}
                        onTouchStart={startTalking}
                        onTouchEnd={stopTalking}
                        className={`btn-3d px-2.5 py-1.5 text-[11px] rounded-lg select-none ${
                            isRecording
                                ? 'bg-red-500 text-white border-2 border-red-200 animate-pulse'
                                : 'btn-success'
                        }`}
                        title="Tahan tombol untuk berbicara (Push-to-Talk)"
                    >
                        {isRecording ? '🔴 BICARA...' : '🎙️ Tahan Bicara'}
                    </button>

                    <button
                        type="button"
                        onClick={(e) => { e.preventDefault(); e.stopPropagation(); setShowMicTest(v => !v); }}
                        className="btn-3d bg-slate-700 text-white border border-slate-500 shadow-[0_3px_0_#334155] px-2 py-1.5 text-[11px] rounded-lg"
                        title="Tes Mikrofon tanpa me-reset permainan"
                    >
                        🎧 <span className="hidden xl:inline ml-1">Tes Mic</span>
                    </button>

                    <button
                        type="button"
                        onClick={(e) => { e.preventDefault(); e.stopPropagation(); onToggleMute(); }}
                        className={`btn-3d px-2 py-1.5 text-[11px] rounded-lg ${
                            voiceMuted ? 'btn-danger' : 'bg-blue-800 text-white border border-blue-500 shadow-[0_3px_0_#1e3a8a]'
                        }`}
                        title={voiceMuted ? "Suara Walkie-Talkie Dimatikan" : "Suara Walkie-Talkie Aktif"}
                    >
                        {voiceMuted ? '🔇' : '🔊'}
                    </button>

                    {/* Non-Resetting Floating Mic Test Modal */}
                    {showMicTest && (
                        <div className="fixed inset-0 z-[85] bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => { stopActiveStreams(); setIsTesting(false); setShowMicTest(false); }}>
                            <div className="bg-white text-slate-800 rounded-3xl p-5 max-w-sm w-full border-4 border-brand-sky shadow-2xl space-y-3 animate-pop" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center">
                                    <h3 className="font-black text-brand-deep text-base">🎧 Tes Mikrofon (Anti-Reset)</h3>
                                    <button type="button" onClick={() => { stopActiveStreams(); setIsTesting(false); setShowMicTest(false); }} className="text-slate-400 hover:text-slate-700 font-black">✖</button>
                                </div>
                                <p className="text-xs font-bold text-slate-600">{micStatus}</p>

                                <div className="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
                                    <div className="bg-emerald-500 h-full transition-all duration-75" style={{ width: `${micLevel}%` }}></div>
                                </div>

                                {speechSample && (
                                    <div className="bg-blue-50 p-2 rounded-xl border border-blue-200 text-xs font-bold text-blue-900">
                                        🗣️ Terdeteksi: "{speechSample}"
                                    </div>
                                )}

                                {testAudioUrl && (
                                    <audio controls src={testAudioUrl} className="w-full h-9" />
                                )}

                                <div className="flex gap-2">
                                    <button type="button" onClick={runMicTest} disabled={isTesting} className="flex-1 btn-3d btn-primary py-2 text-xs">
                                        {isTesting ? '🎙️ Merekam (3 dtk)...' : '▶ Mulai Tes Mic'}
                                    </button>
                                    <button type="button" onClick={() => { stopActiveStreams(); setIsTesting(false); setShowMicTest(false); }} className="btn-3d bg-slate-200 text-slate-700 px-3 py-2 text-xs">
                                        Tutup
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Live Avatars Strip: Shows Overhead Level & Points above every player's head
        const LiveAvatarStrip = ({ players, myUid, roomCode, activeSpeaker }) => {
            if (!roomCode || !players || players.length === 0) return null;
            const sorted = [...players].sort((a, b) => (b.points || 0) - (a.points || 0));

            return (
                <div className="bg-slate-900/90 border-b-2 border-slate-700 px-3 py-1.5 shrink-0 z-30 flex items-center gap-3 overflow-x-auto">
                    <span className="text-[10px] font-black text-brand-sky uppercase shrink-0">
                        👥 Live ({sorted.length}):
                    </span>
                    <div className="flex items-center gap-3">
                        {sorted.map((p, idx) => {
                            const isSpeaking = activeSpeaker?.senderId === p.uid;
                            const isMe = p.uid === myUid;
                            return (
                                <div key={p.uid} className={`flex flex-col items-center shrink-0 px-2 py-0.5 rounded-xl border ${
                                    isSpeaking ? 'bg-emerald-500/20 border-emerald-400 animate-pulse' :
                                    isMe ? 'bg-blue-500/20 border-brand-sky' : 'bg-slate-800/70 border-slate-700'
                                }`}>
                                    <div className="flex items-center gap-1 text-[9px] font-black text-brand-yellow leading-none mb-0.5">
                                        <span>Lv.{calcLevel(p.points)}</span>
                                        <span>•</span>
                                        <span>{p.points || 0} Pts</span>
                                    </div>
                                    <div className="flex items-center gap-1">
                                        <span className="text-base leading-none">{p.avatar || '🕵️‍♂️'}</span>
                                        <span className="text-[10px] font-bold text-white max-w-[70px] truncate">
                                            {idx === 0 && (p.points || 0) > 0 ? '👑 ' : ''}{p.name}
                                        </span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // Minimizable Student List & Live Chat Floating Panels
        const FloatingMultiplayerPanels = ({ roomCode, players, messages, myUid, senderName, senderAvatar, isTeacher }) => {
            const [showStudents, setShowStudents] = useState(false);
            const [showChat, setShowChat] = useState(false);
            const [chatInput, setChatInput] = useState('');
            const chatEndRef = useRef(null);

            useEffect(() => {
                if (showChat && chatEndRef.current) {
                    chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [messages, showChat]);

            if (!roomCode) return null;

            const sortedPlayers = [...(players || [])].sort((a, b) => (b.points || 0) - (a.points || 0));

            const handleSendChat = async (e) => {
                e.preventDefault();
                if (!chatInput.trim() || !window.FB_BRIDGE) return;
                await window.FB_BRIDGE.sendChat(roomCode, {
                    senderId: myUid,
                    senderName: senderName || (isTeacher ? 'Guru' : 'Murid'),
                    senderAvatar: senderAvatar || (isTeacher ? '👩‍🏫' : '🕵️‍♂️'),
                    isTeacher: !!isTeacher,
                    text: chatInput.trim()
                });
                setChatInput('');
            };

            return (
                <div className="fixed bottom-14 md:bottom-3 right-3 z-50 flex flex-col items-end gap-2">
                    {/* Expanded Panels */}
                    <div className="flex flex-wrap justify-end items-end gap-2">
                        {showStudents && (
                            <div className="w-64 sm:w-72 bg-white rounded-2xl border-4 border-brand-sky shadow-2xl overflow-hidden animate-pop">
                                <div className="bg-brand-deep text-white px-3 py-2 flex justify-between items-center">
                                    <span className="font-black text-xs">👥 Daftar Murid ({sortedPlayers.length})</span>
                                    <button type="button" onClick={() => setShowStudents(false)} className="text-xs font-black hover:text-brand-yellow">➖</button>
                                </div>
                                <div className="max-h-56 overflow-y-auto p-2 space-y-1.5 bg-slate-50">
                                    {sortedPlayers.length === 0 ? (
                                        <p className="text-center text-xs font-bold text-slate-400 py-4">Belum ada murid bergabung.</p>
                                    ) : sortedPlayers.map((p, i) => (
                                        <div key={p.uid} className={`flex items-center justify-between p-2 rounded-xl border text-xs ${p.uid === myUid ? 'bg-blue-50 border-blue-300' : 'bg-white border-slate-200'}`}>
                                            <div className="flex items-center gap-2 min-w-0">
                                                <span className="font-black text-slate-500">#{i + 1}</span>
                                                <span className="text-lg">{p.avatar || '🕵️‍♂️'}</span>
                                                <div className="min-w-0">
                                                    <div className="font-black text-slate-800 truncate">{p.name}</div>
                                                    <div className="text-[10px] font-bold text-blue-600">Lv.{calcLevel(p.points)} • {p.class || 'VII'}</div>
                                                </div>
                                            </div>
                                            <span className="bg-brand-yellow text-yellow-950 font-black px-2 py-0.5 rounded-full text-[10px] shrink-0">
                                                {p.points || 0} Pts
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {showChat && (
                            <div className="w-64 sm:w-72 bg-white rounded-2xl border-4 border-brand-purple shadow-2xl overflow-hidden animate-pop flex flex-col">

        // Fastest Champion Certificate Modal (PNG & PDF Download)
        const CertificateModal = ({ show, onClose, user, progress, roomCode, roomData, players, showModal }) => {
            const canvasRef = useRef(null);
            const sorted = [...(players || [])].sort((a, b) => (b.points || 0) - (a.points || 0));
            const topScore = sorted.length > 0 ? (sorted[0].points || 0) : progress.points;
            const isTopScorer = !roomCode || sorted.length === 0 || progress.points >= topScore;
            const winner = roomData?.certificateWinner;

            useEffect(() => {
                if (!show || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const w = canvas.width;
                const h = canvas.height;

                // Background gradient
                const grad = ctx.createLinearGradient(0, 0, w, h);
                grad.addColorStop(0, '#fefce8');
                grad.addColorStop(1, '#e0f2fe');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                // Outer & inner decorative borders
                ctx.strokeStyle = '#1e3a8a';
                ctx.lineWidth = 18;
                ctx.strokeRect(20, 20, w - 40, h - 40);
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 6;
                ctx.strokeRect(36, 36, w - 72, h - 72);

                // Header text
                ctx.fillStyle = '#1e3a8a';
                ctx.textAlign = 'center';
                ctx.font = '900 44px Nunito, sans-serif';
                ctx.fillText('CERTIFICATE OF ACHIEVEMENT', w / 2, 125);

                ctx.fillStyle = '#0284c7';
                ctx.font = '800 22px Nunito, sans-serif';
                ctx.fillText('DESCRIPTIVE TEXT ADVENTURE • MULTIPLAYER CHAMPION', w / 2, 168);

                ctx.fillStyle = '#475569';
                ctx.font = '700 20px Nunito, sans-serif';
                ctx.fillText('This certificate is proudly awarded to:', w / 2, 230);

                // Student Name
                ctx.fillStyle = '#b45309';
                ctx.font = '900 52px Nunito, sans-serif';
                ctx.fillText((user.name || 'Young Detective').toUpperCase(), w / 2, 305);

                // Line under name
                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(220, 325);
                ctx.lineTo(w - 220, 325);
                ctx.stroke();

                // Details
                ctx.fillStyle = '#334155';
                ctx.font = '700 22px Nunito, sans-serif';
                ctx.fillText(`Class: ${user.class || 'Grade VII'}   •   Level ${calcLevel(progress.points)}   •   Total Score: ${progress.points} Points`, w / 2, 375);

                ctx.fillStyle = '#0f766e';
                ctx.font = '800 20px Nunito, sans-serif';
                ctx.fillText('For outstanding mastery in describing People, Animals, Things, and Place!', w / 2, 425);

                // Footer signatures
                ctx.fillStyle = '#475569';
                ctx.font = '700 18px Nunito, sans-serif';
                ctx.fillText(`Date: ${new Date().toLocaleDateString('id-ID')}`, 230, 520);
                ctx.fillText(COURSE_INFO.lecturer, w - 260, 520);
                ctx.font = '600 15px Nunito, sans-serif';

            }, [show, user, progress]);

            if (!show) return null;

            const handleClaimFastest = async () => {

            const downloadPNG = () => {
                if (!canvasRef.current) return;

                link.download = `Certificate_${(user.name || 'Student').replace(/\s+/g, '_')}.png`;
                link.href = canvasRef.current.toDataURL('image/png');
                link.click();
            };

            const downloadPDF = () => {
                if (!canvasRef.current) return;
                try {
                    const imgData = canvasRef.current.toDataURL('image/png');
                    const { jsPDF } = window.jspdf || {};
                    if (!jsPDF) {
                        showModal("PDF Library Loading", "Gunakan tombol Download PNG atau coba lagi sebentar.", "info");
                        return;
                    }
                    const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [1000, 640] });
                    pdf.addImage(imgData, 'PNG', 0, 0, 1000, 640);
                    pdf.save(`Certificate_${(user.name || 'Student').replace(/\s+/g, '_')}.pdf`);
                } catch (e) {
                    showModal("Gagal Membuat PDF", "Silakan gunakan Download PNG.", "error");

            return (
                <div className="fixed inset-0 z-[85] bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-3" onClick={onClose}>
                    <div className="game-card max-w-2xl w-full p-4 sm:p-5 animate-pop space-y-3" onClick={e => e.stopPropagation()}>

                        <div className="flex flex-wrap gap-2 justify-between">
                            <button type="button" onClick={handleClaimFastest} className="btn-3d btn-primary px-4 py-2 text-xs flex-1">
                                👑 {isTopScorer ? 'Klaim Sertifikat Tercepat' : `Butuh ${topScore} Pts`}
                            </button>
                            <button type="button" onClick={downloadPNG} className="btn-3d btn-secondary px-4 py-2 text-xs">
                                🖼️ Download PNG
                            </button>
                            <button type="button" onClick={downloadPDF} className="btn-3d btn-success px-4 py-2 text-xs">
                                📄 Download PDF

        // Live Shared Collaborative Drag & Drop Screen (Everyone sees everyone's moves!)
        const ScreenLiveSharedDragDrop = ({ roomCode, roomData, user, isTeacher, onBack }) => {
            const worldId = roomData?.sharedTask?.worldId || 'people';

                            <button type="button" onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_3px_0_#cbd5e1] px-3 py-1 text-xs">
                                ⬅️ Kembali
                            </button>
                            <span className="bg-red-500 text-white font-black px-3 py-1 rounded-full text-[11px] animate-pulse">
                                🔴 LIVE SHARED TASK • Semua orang dapat menggeser & melihat hasil bersama!
                            </span>
                        </div>

                        <div className="game-card p-3 sm:p-4 flex-1 min-h-0 flex flex-col gap-2.5 overflow-hidden">
                            <div className="flex items-center gap-3 bg-slate-50 p-2 rounded-2xl border-2 border-slate-200 shrink-0">
                                <div className="w-24 sm:w-32 shrink-0">
                                    <TopicIllustration topicId={world.id} className="w-full h-16 sm:h-20 rounded-xl" />
                                </div>
                                <div className="min-w-0">
                                    <h2 className="text-base sm:text-xl font-black text-brand-deep truncate">
                                        🧲 Live Collaborative Drag & Drop: {world.subjectTitle}
                                    </h2>
                                    <p className="text-[11px] sm:text-xs font-bold text-slate-600">

                                    return (
                                        <div

                                            onDragOver={(e) => e.preventDefault()}
                                            onDrop={(e) => {
                                                e.preventDefault();
                                                const id = e.dataTransfer.getData('text/plain') || selectedItem;
                                                if (id) moveCardShared(id, cat.id);
                                            }}
                                            onClick={() => { if (selectedItem) moveCardShared(selectedItem, cat.id); }}
                                            className={`drop-zone rounded-2xl border-4 border-dashed flex flex-col overflow-hidden min-h-0 ${cat.color} ${selectedItem ? 'cursor-pointer ring-2 ring-brand-sky' : ''}`}

                                            <div className="p-2 flex flex-wrap content-start gap-1.5 flex-1 min-h-0 overflow-hidden">
                                                {placed.map(it => {

                                                            className={`drag-chip px-2 py-1 rounded-xl border-2 text-[11px] font-bold flex items-center gap-1.5 ${
                                                                isCorrect ? 'bg-green-50 border-green-400 text-green-900' : 'bg-red-50 border-red-400 text-red-900'

                                                        >
                                                            <span>{it.text}</span>

                                                            <span>{isCorrect ? '✅' : '❌'}</span>

                            {/* Remaining Bank */}

                                            draggable

                                            onClick={() => setSelectedItem(selectedItem === it.id ? null : it.id)}
                                            className={`drag-chip px-2.5 py-1 rounded-xl font-bold text-[11px] border-2 ${
                                                selectedItem === it.id ? 'bg-brand-yellow border-yellow-600 text-yellow-950' : 'bg-white border-slate-300 text-slate-800'
                                            }`}
                                        >
                                            {it.text}

                                    ))}

                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // =========================================================================
        // 7. MAIN APP COMPONENT
        // =========================================================================
        const STATE_STORAGE_KEY = 'dta_live_state_v2';

        const loadSavedAppState = () => {
            try {
                const rawSession = sessionStorage.getItem(STATE_STORAGE_KEY);
                if (rawSession) return JSON.parse(rawSession);
                const rawLocal = localStorage.getItem(STATE_STORAGE_KEY);
                if (rawLocal) {
                    const parsed = JSON.parse(rawLocal);
                    // Restore recent session (within 6 hours) on page refresh or browser reload
                    if (parsed && parsed.savedAt && (Date.now() - parsed.savedAt) < 6 * 60 * 60 * 1000) {
                        return parsed;
                    }
                }
                return null;
            } catch (e) {
                return null;
            }
        };

        const App = () => {
            const restored = useMemo(() => loadSavedAppState(), []);

            const [screen, setScreen] = useState(restored?.screen || 'home');
            const [activeWorld, setActiveWorld] = useState(restored?.activeWorld || 'people');
            const [user, setUser] = useState(restored?.user || { name: '', class: '', groupName: '', members: '', avatar: '🕵️‍♂️', roomCode: '' });
            const [progress, setProgress] = useState(restored?.progress || { points: 0, stars: 0, completed: [] });
            const [savedWritings, setSavedWritings] = useState(restored?.savedWritings || {});
            const [modal, setModal] = useState({ show: false, title: '', message: '', type: 'info', onClose: null });
            const [rewardAnim, setRewardAnim] = useState(null);

            // Multiplayer States
            const [fbReady, setFbReady] = useState(!!window.FB_BRIDGE?.ready);
            const [roomCode, setRoomCode] = useState(restored?.roomCode || '');
            const [roomData, setRoomData] = useState(null);
            const [roomPlayers, setRoomPlayers] = useState([]);
            const [roomMessages, setRoomMessages] = useState([]);
            const [voiceMuted, setVoiceMuted] = useState(false);
            const [activeSpeaker, setActiveSpeaker] = useState(null);
            const [showCertModal, setShowCertModal] = useState(false);
            const [isTeacherHost, setIsTeacherHost] = useState(!!restored?.isTeacherHost);
            const [teacherName, setTeacherName] = useState(restored?.teacherName || 'Guru Utama');

            const lastPlayedVoiceRef = useRef(Date.now());
            const lastSharedTaskTsRef = useRef(0);
            const stateRef = useRef({});

            const isStudentFocusLocked = !isTeacherHost && !!roomData?.focusMode;
            const isFocusSynced = !!roomCode && !!roomData?.focusMode;
            const actorInfo = {
                uid: window.FB_BRIDGE?.uid || 'local',
                name: isTeacherHost ? teacherName : (user.name || 'Student'),
                avatar: isTeacherHost ? '👩‍🏫' : (user.avatar || '🕵️‍♂️'),
                isTeacher: isTeacherHost
            };

            const syncFocusState = async (sectionKey, value) => {
                if (!roomCode || !roomData?.focusMode) return;
                const currentFocusState = roomData.focusState || {};
                await window.FB_BRIDGE.upsertRoom(roomCode, {
                    focusState: {
                        ...currentFocusState,
                        [sectionKey]: value,
                        updatedAt: Date.now()
                    }
                });
            };

            useEffect(() => {
                const onReady = () => setFbReady(true);
                window.addEventListener('fb-bridge-ready', onReady);
                return () => window.removeEventListener('fb-bridge-ready', onReady);
            }, []);

            // Persist exact session state in both sessionStorage & localStorage (including beforeunload) so page refresh NEVER resets to home
            useEffect(() => {
                const snapshotObj = {
                    screen, activeWorld, user, progress, savedWritings, roomCode, isTeacherHost, teacherName, savedAt: Date.now()
                };
                stateRef.current = snapshotObj;
                try {
                    const snapshot = JSON.stringify(snapshotObj);
                    sessionStorage.setItem(STATE_STORAGE_KEY, snapshot);
                    localStorage.setItem(STATE_STORAGE_KEY, snapshot);
                } catch (e) {}
            }, [screen, activeWorld, user, progress, savedWritings, roomCode, isTeacherHost, teacherName]);

            useEffect(() => {
                const persistNow = () => {
                    try {
                        const snapshot = JSON.stringify({ ...stateRef.current, savedAt: Date.now() });
                        sessionStorage.setItem(STATE_STORAGE_KEY, snapshot);
                        localStorage.setItem(STATE_STORAGE_KEY, snapshot);
                    } catch (e) {}
                };
                window.addEventListener('beforeunload', persistNow);
                document.addEventListener('visibilitychange', persistNow);
                return () => {
                    window.removeEventListener('beforeunload', persistNow);
                    document.removeEventListener('visibilitychange', persistNow);
                };
            }, []);

            // When Teacher is in Focus Mode, broadcast every menu/screen & world change to all students in real time!
            useEffect(() => {
                if (!fbReady || !roomCode || !isTeacherHost || !roomData?.focusMode) return;
                if (roomData.focusScreen !== screen || roomData.focusWorld !== activeWorld) {
                    window.FB_BRIDGE.upsertRoom(roomCode, {
                        focusScreen: screen,
                        focusWorld: activeWorld,
                        focusUpdatedAt: Date.now()
                    });
                }
            }, [fbReady, roomCode, isTeacherHost, roomData?.focusMode, screen, activeWorld]);

            // Subscribe to Real-Time Multiplayer Room (also immediately syncs refreshed student to Teacher's latest screen!)
            useEffect(() => {
                if (!fbReady || !roomCode || !window.FB_BRIDGE) return;
                const unsub = window.FB_BRIDGE.subscribeRoom(
                    roomCode,
                    (rData) => {
                        setRoomData(rData);
                        if (!isTeacherHost && rData) {
                            // On refresh or live update: if Focus Mode is active, immediately follow teacher's latest screen & world
                            if (rData.focusMode && rData.focusScreen && rData.focusScreen !== 'dashboard' && rData.focusScreen !== 'home') {
                                if (rData.focusWorld) setActiveWorld(rData.focusWorld);
                                setScreen(rData.focusScreen);
                            } else if (rData.sharedTask?.active && rData.sharedTask.startedAt >= lastSharedTaskTsRef.current) {
                                lastSharedTaskTsRef.current = rData.sharedTask.startedAt;
                                setScreen('live_shared_task');
                            }
                        }
                    },
                    (players) => setRoomPlayers(players),
                    (msgs) => setRoomMessages(msgs),
                    (voices) => {
                        if (!voices || voices.length === 0) return;
                        const latest = voices[voices.length - 1];
                        if (latest.createdAt > lastPlayedVoiceRef.current && latest.senderId !== window.FB_BRIDGE.uid) {
                            lastPlayedVoiceRef.current = latest.createdAt;
                            setActiveSpeaker(latest);
                            setTimeout(() => setActiveSpeaker(null), 4000);
                            if (!voiceMuted && latest.audioData) {
                                try {
                                    const audio = new Audio(latest.audioData);
                                    audio.play().catch(() => {});
                                } catch (e) {}
                            }
                        }
                    }
                );
                return () => unsub && unsub();
            }, [fbReady, roomCode, voiceMuted, isTeacherHost]);

            // Sync my player stats to room whenever points/stars/name change
            useEffect(() => {
                if (!fbReady || !roomCode || isTeacherHost || !user.name) return;
                window.FB_BRIDGE.upsertPlayer(roomCode, window.FB_BRIDGE.uid, {
                    name: user.name,
                    class: user.class || 'VII',
                    groupName: user.groupName || '',
                    avatar: user.avatar || '🕵️‍♂️',
                    points: progress.points,
                    stars: progress.stars,
                    level: calcLevel(progress.points),
                    updatedAt: Date.now()
                });

            };

            const closeModal = () => {
                const cb = modal.onClose;
                setModal({ show: false, title: '', message: '', type: 'info', onClose: null });
                if (cb) cb();
            };

            const addReward = (points, stars, missionId = null) => {
                setProgress(prev => {
                    const alreadyDone = missionId && prev.completed.includes(missionId);
                    const earnedPts = alreadyDone ? 0 : points + (missionId ? 20 : 0);
                    const earnedStars = alreadyDone ? 0 : stars;
                    const newCompleted = (missionId && !alreadyDone) ? [...prev.completed, missionId] : prev.completed;

                    if (earnedPts > 0 || earnedStars > 0) {
                        setRewardAnim({ points: earnedPts, stars: earnedStars });
                        setTimeout(() => setRewardAnim(null), 1800);
                    }

                    return {
                        points: prev.points + earnedPts,
                        stars: prev.stars + earnedStars,
                        completed: newCompleted
                    };
                });
            };

            const saveSession = (reflectionData) => {
                try {
                    const history = JSON.parse(localStorage.getItem('dta_teacher_data') || '[]');
                    history.push({ date: new Date().toISOString(), user, progress, writings: savedWritings, reflection: reflectionData });
                    localStorage.setItem('dta_teacher_data', JSON.stringify(history));
                } catch (e) {}
            };

            const openWorld = (worldId) => {
                if (isStudentFocusLocked) {
                    showModal("🔒 Mode Fokus Aktif", "Anda sedang mengikuti layar guru. Tidak dapat pindah menu lain sebelum Mode Fokus dimatikan oleh guru.", "info");

            };

            const toggleTeacherFocusQuick = async () => {

                    focusScreen: screen,

                                    setIsTeacherHost(false);
                                    setScreen('credits');
                                }}
                            />

                        {screen === 'credits' && <ScreenCredits user={user} onNext={() => navigateScreen('howtoplay')} />}
                        {screen === 'howtoplay' && <ScreenHowToPlay onNext={() => navigateScreen('objectives')} />}
                        {screen === 'objectives' && <ScreenObjectives onNext={() => navigateScreen('map')} />}
                        {screen === 'map' && (
                            <ScreenMap
                                progress={progress}
                                roomData={roomData}
                                onSelect={(s) => navigateScreen(s)}
                                onOpenWorld={openWorld}
                            />

                        {screen === 'live_shared_task' && (
                            <ScreenLiveSharedDragDrop
                                roomCode={roomCode}
                                roomData={roomData}
                                user={user}
                                isTeacher={isTeacherHost}
                                onBack={() => navigateScreen(isTeacherHost ? 'dashboard' : 'map')}
                            />
                        )}

                        {screen === 'mat_def' && (
                            <ScreenMaterial
                                data={MATERIAL_CONTENT.def}
                                onBack={() => navigateScreen('map')}
                                onComplete={() => { addReward(10, 1, 'mat_def'); navigateScreen('map'); }}
                            />
                        )}
                        {screen === 'mat_struct' && (
                            <ScreenStructure
                                data={MATERIAL_CONTENT.structure}
                                onBack={() => navigateScreen('map')}
                                onComplete={() => { addReward(10, 1, 'mat_struct'); navigateScreen('map'); }}
                            />

                        {screen === 'mat_lang' && (
                            <ScreenLangFeatures
                                data={MATERIAL_CONTENT.lang}
                                isFocusSynced={isFocusSynced}
                                sharedTab={roomData?.focusState?.langTab}
                                onSyncTab={(tabIdx) => syncFocusState('langTab', tabIdx)}
                                onBack={() => navigateScreen('map')}
                                onComplete={() => { addReward(10, 1, 'mat_lang'); navigateScreen('map'); }}
                            />

                            <ScreenSentenceBuilder
