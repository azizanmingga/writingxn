                            {/* Right: Categorized Phrases */}
                            <div className={`lg:col-span-7 grid grid-cols-1 ${world.categories.length === 3 ? 'sm:grid-cols-3' : 'sm:grid-cols-2'} gap-2 min-h-0`}>
                                {world.categories.map(cat => (
                                    <div key={cat.id} className={`rounded-xl border-2 overflow-hidden flex flex-col min-h-0 ${cat.color}`}>
                                        <div className={`${cat.headerBg} text-white font-black px-3 py-1.5 text-xs flex items-center gap-1.5 shrink-0`}>
                                            <span>{cat.icon}</span> {cat.label}
                                        </div>
                                        <ul className="p-2 space-y-1 flex-1 overflow-hidden">
                                            {world.sortItems.filter(i => i.category === cat.id).map(item => (
                                                <li key={item.id} className="bg-white/90 px-2 py-1 rounded-lg text-[11px] font-bold text-slate-700 border border-slate-100 leading-tight">
                                                    • {item.text}
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <button type="button" onClick={onComplete} className="w-full btn-3d btn-primary py-2.5 text-sm sm:text-base shrink-0">
                            NEXT: INTERACTIVE DRAG & DROP 🧲 (+20 Pts)
                        </button>
                    </div>
                </div>
            </div>
        );

        const ScreenDragDropSorter = ({ world, showModal, isFocusSynced, sharedVocabState, onSyncVocab, actorInfo, onBack, onComplete }) => {
            const shuffledInitial = useMemo(() => [...world.sortItems].sort(() => Math.random() - 0.5), [world.id]);
            const [localBank, setLocalBank] = useState(shuffledInitial);
            const [localBoxes, setLocalBoxes] = useState(() => {
                const init = {};
                world.categories.forEach(c => { init[c.id] = []; });
                return init;
            });
            const [localCheckedStatus, setLocalCheckedStatus] = useState(null);
            const [selectedItem, setSelectedItem] = useState(null);
            const [dragOverCat, setDragOverCat] = useState(null);

            useEffect(() => {
                setLocalBank([...world.sortItems].sort(() => Math.random() - 0.5));
                const init = {};
                world.categories.forEach(c => { init[c.id] = []; });
                setLocalBoxes(init);
                setSelectedItem(null);
                setLocalCheckedStatus(null);
            }, [world.id]);

            // Derive synced vs local state cleanly
            const sharedAssignments = (isFocusSynced && sharedVocabState?.assignments) ? sharedVocabState.assignments : null;
            const bank = sharedAssignments
                ? world.sortItems.filter(it => !sharedAssignments[it.id])
                : localBank;
            const boxes = useMemo(() => {
                if (!sharedAssignments) return localBoxes;
                const b = {};
                world.categories.forEach(c => {
                    b[c.id] = world.sortItems.filter(it => sharedAssignments[it.id]?.category === c.id);
                });
                return b;
            }, [sharedAssignments, localBoxes, world]);
            const checkedStatus = isFocusSynced ? (sharedVocabState?.checkedStatus || null) : localCheckedStatus;
            const lastMover = isFocusSynced ? sharedVocabState?.lastMover : null;

            const moveItemToCategory = (itemId, targetCatId) => {
                if (isFocusSynced && onSyncVocab) {
                    const updated = { ...(sharedVocabState?.assignments || {}) };
                    if (targetCatId === 'bank') {
                        delete updated[itemId];
                    } else {
                        updated[itemId] = {
                            category: targetCatId,
                            byName: actorInfo?.name || 'Student',
                            byAvatar: actorInfo?.avatar || '🕵️‍♂️'
                        };
                    }
                    onSyncVocab({
                        assignments: updated,
                        checkedStatus: null,
                        lastMover: `${actorInfo?.avatar || '🕵️‍♂️'} ${actorInfo?.name || 'Student'}`
                    });
                    setSelectedItem(null);
                    return;
                }

                setLocalCheckedStatus(null);
                let item = localBank.find(i => i.id === itemId);
                let newBank = [...localBank];
                const newBoxes = {};
                world.categories.forEach(c => { newBoxes[c.id] = [...localBoxes[c.id]]; });

                if (item) {
                    newBank = newBank.filter(i => i.id !== itemId);
                } else {
                    for (const catId of Object.keys(newBoxes)) {
                        const found = newBoxes[catId].find(i => i.id === itemId);
                        if (found) {
                            item = found;
                            newBoxes[catId] = newBoxes[catId].filter(i => i.id !== itemId);
                            break;
                        }
                    }
                }
                if (!item) return;
                if (targetCatId === 'bank') newBank.push(item);
                else newBoxes[targetCatId].push(item);

                setLocalBank(newBank);
                setLocalBoxes(newBoxes);
                setSelectedItem(null);
            };

            const handleReset = () => {
                if (isFocusSynced && onSyncVocab) {
                    onSyncVocab({ assignments: {}, checkedStatus: null, lastMover: `${actorInfo?.avatar} ${actorInfo?.name} (Reset)` });
                    setSelectedItem(null);
                    return;
                }
                setLocalBank([...world.sortItems].sort(() => Math.random() - 0.5));
                const init = {}; world.categories.forEach(c => { init[c.id] = []; }); setLocalBoxes(init);
                setSelectedItem(null); setLocalCheckedStatus(null);
            };

            const handleCheck = () => {
                if (bank.length > 0) {
                    showModal("Almost There! 🧲", `Please sort all remaining ${bank.length} card(s) into the boxes first.`, "info");
                    return;
                }
                const statusMap = {};
                let correctCount = 0;
                world.categories.forEach(cat => {
                    boxes[cat.id].forEach(item => {
                        const isRight = item.category === cat.id;
                        statusMap[item.id] = isRight;
                        if (isRight) correctCount++;
                    });
                });

                if (isFocusSynced && onSyncVocab) {
                    onSyncVocab({
                        assignments: sharedVocabState?.assignments || {},
                        checkedStatus: statusMap,
                        lastMover: `${actorInfo?.avatar} ${actorInfo?.name} (Checked: ${correctCount}/${world.sortItems.length})`
                    });
                } else {
                    setLocalCheckedStatus(statusMap);
                }

                if (correctCount === world.sortItems.length) {
                    showModal("Awesome Job! 🌟", `All ${correctCount} phrases about ${world.subjectTitle} are in the correct boxes!`, "success", isFocusSynced ? null : onComplete);
                } else {
                    showModal("Keep Trying! 🔍", `${correctCount} out of ${world.sortItems.length} correct. Red cards are in the wrong box—drag or tap them to move!`, "error");
                }
            };

            return (
                <div className={`flex-1 min-h-0 p-2 sm:p-3 ${world.themeBg} overflow-hidden flex flex-col`}>
                    <div className="max-w-6xl w-full mx-auto flex-1 min-h-0 flex flex-col gap-2">
                        <div className="flex flex-wrap justify-between items-center gap-2 shrink-0">
                            <button type="button" onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_3px_0_#cbd5e1] px-3 py-1 text-xs">
                                ⬅️ Back
                            </button>
                            <div className="flex items-center gap-2">
                                {isFocusSynced && (
                                    <span className="bg-emerald-500 text-white text-[10px] font-black px-2.5 py-1 rounded-full animate-pulse">
                                        📡 LIVE SYNC {lastMover ? `• Terakhir: ${lastMover}` : ''}
                                    </span>
                                )}
                                <span className={`text-[11px] font-black px-2.5 py-0.5 rounded-full border ${world.badgeColor}`}>
                                    🧲 {world.subjectTitle}
                                </span>
                            </div>
                        </div>

                        <div className="game-card p-3 sm:p-4 animate-pop flex-1 min-h-0 flex flex-col gap-2.5 overflow-hidden">
                            <div className="flex items-center gap-3 bg-slate-50 p-2 rounded-xl border border-slate-200 shrink-0">
                                <div className="w-20 sm:w-28 shrink-0">
                                    <TopicIllustration topicId={world.id} className="w-full h-14 sm:h-16 rounded-lg" />
                                </div>
                                <div>
                                    <h2 className="text-sm sm:text-lg font-black text-brand-deep">Drag & Drop Into the Right Box!</h2>
                                    <p className="text-[11px] font-bold text-slate-600">
                                        Seret kartu atau klik kartu lalu klik kotak kategori. {isFocusSynced ? 'Jawaban murid langsung terlihat di layar guru & semua murid!' : ''}
                                    </p>
                                </div>
                            </div>

                            <div className={`grid grid-cols-1 ${world.categories.length === 3 ? 'md:grid-cols-3' : 'md:grid-cols-2'} gap-2.5 flex-1 min-h-0`}>
                                {world.categories.map(cat => (
                                    <div
                                        key={cat.id}
                                        onDragOver={(e) => { e.preventDefault(); setDragOverCat(cat.id); }}
                                        onDragLeave={() => setDragOverCat(null)}
                                        onDrop={(e) => {
                                            e.preventDefault();
                                            setDragOverCat(null);
                                            const id = e.dataTransfer.getData('text/plain') || selectedItem;
                                            if (id) moveItemToCategory(id, cat.id);
                                        }}
                                        onClick={() => { if (selectedItem) moveItemToCategory(selectedItem, cat.id); }}
                                        className={`drop-zone rounded-2xl border-3 border-dashed flex flex-col overflow-hidden min-h-0 ${cat.color} ${dragOverCat === cat.id ? 'drag-over' : ''} ${selectedItem ? 'cursor-pointer ring-2 ring-brand-sky/60' : ''}`}
                                    >
                                        <div className={`${cat.headerBg} text-white font-black px-3 py-1 text-xs flex justify-between items-center shrink-0`}>
                                            <span>{cat.icon} {cat.label}</span>
                                            <span className="bg-white/25 px-2 py-0.5 rounded-full text-[10px]">{boxes[cat.id].length}</span>
                                        </div>
                                        <div className="p-2 flex-1 flex flex-wrap content-start gap-1.5 min-h-0 overflow-hidden">
                                            {boxes[cat.id].length === 0 ? (
                                                <div className="w-full h-full flex items-center justify-center text-slate-400 font-bold text-xs text-center">
                                                    {selectedItem ? "Tap here to drop!" : "Drop phrases here"}
                                                </div>
                                            ) : boxes[cat.id].map(item => {
                                                const status = checkedStatus ? checkedStatus[item.id] : null;
                                                const mover = sharedAssignments?.[item.id];
                                                return (
                                                    <div
                                                        key={item.id}
                                                        draggable
                                                        onDragStart={(e) => { e.dataTransfer.setData('text/plain', item.id); setSelectedItem(item.id); }}
                                                        onClick={(e) => { e.stopPropagation(); moveItemToCategory(item.id, 'bank'); }}
                                                        className={`drag-chip px-2 py-1 rounded-lg font-bold text-[11px] shadow-sm border-2 flex items-center gap-1.5 ${
                                                            status === true ? 'bg-green-100 border-green-500 text-green-900' :
                                                            status === false ? 'bg-red-100 border-red-500 text-red-900' :
                                                            'bg-white border-slate-200 text-slate-800 hover:border-brand-sky'
                                                        }`}
                                                    >
                                                        <span>{item.text}</span>
                                                        {mover && <span className="text-[9px] text-slate-500 font-black">({mover.byName})</span>}
                                                        <span className="text-[10px] opacity-70">{status === true ? '✅' : status === false ? '❌' : '↩️'}</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="bg-slate-100 rounded-xl p-2.5 border-2 border-slate-300 shrink-0">
                                <div className="text-[11px] font-black text-slate-700 uppercase mb-1.5">📦 Phrase List ({bank.length} remaining)</div>
                                {bank.length === 0 ? (
                                    <p className="text-center text-green-600 font-black py-1 text-xs">🎉 All cards placed! Click "CHECK ANSWERS" below.</p>
                                ) : (
                                    <div className="flex flex-wrap gap-1.5">
                                        {bank.map(item => (
                                            <button
                                                key={item.id}
                                                type="button"
                                                draggable
                                                onDragStart={(e) => { e.dataTransfer.setData('text/plain', item.id); setSelectedItem(item.id); }}
                                                onClick={() => setSelectedItem(selectedItem === item.id ? null : item.id)}
                                                className={`drag-chip px-2.5 py-1 rounded-lg font-bold text-[11px] border-2 shadow-[0_2px_0_#cbd5e1] text-left ${
                                                    selectedItem === item.id ? 'bg-brand-yellow border-yellow-600 text-yellow-950 scale-105' : 'bg-white border-slate-300 text-slate-800 hover:bg-blue-50'
                                                }`}
                                            >
                                                {item.text}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="flex gap-2.5 shrink-0">
                                <button type="button" onClick={handleReset} className="w-1/3 btn-3d bg-slate-200 text-slate-700 border-2 border-slate-300 shadow-[0_3px_0_#94a3b8] py-2 text-xs">
                                    🔄 RESET
                                </button>
                                <button type="button" onClick={handleCheck} className="w-2/3 btn-3d btn-primary py-2 text-sm">
                                    ✅ CHECK ANSWERS
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenGrammar = ({ data, title = "Grammar Detective", world = null, onBack, onComplete, showModal, isFinal = false, isFocusSynced, sharedGrammarState, onSyncGrammar, actorInfo, onAwardPoint }) => {
            const [localQ, setLocalQ] = useState(0);
            useEffect(() => { setLocalQ(0); }, [data]);

            const currentQ = (isFocusSynced && typeof sharedGrammarState?.currentQ === 'number')
                ? Math.min(sharedGrammarState.currentQ, data.length - 1)
                : localQ;
            const liveAnswer = isFocusSynced ? sharedGrammarState?.lastAnswer : null;

            const handleAnswer = (index) => {
                const q = data[currentQ];
                const isCorrect = index === q.correct;

                if (isFocusSynced && onSyncGrammar) {
                    const nextQ = isCorrect ? Math.min(currentQ + 1, data.length - 1) : currentQ;
                    if (isCorrect && onAwardPoint) onAwardPoint();
                    onSyncGrammar({
                        currentQ,
                        lastAnswer: {
                            qIndex: currentQ,
                            optionIndex: index,
                            isCorrect,
                            byName: actorInfo?.name || 'Student',
                            byAvatar: actorInfo?.avatar || '🕵️‍♂️',
                            exp: q.exp,
                            ts: Date.now()
                        }
                    });
                    if (isCorrect && currentQ < data.length - 1) {
                        setTimeout(() => {
                            onSyncGrammar({
                                currentQ: nextQ,
                                lastAnswer: null
                            });
                        }, 1600);
                    }
                    return;
                }

                if (isCorrect) {
                    showModal("Correct! 🎯", q.exp || "Great grammar detective work!", "success", () => {
                        if (localQ < data.length - 1) setLocalQ(prev => prev + 1);
                        else if (isFinal) showModal("Final Challenge Complete! 🏆", "You conquered the Final Descriptive Boss!", "success", onComplete);
                        else onComplete();
                    });
                } else {
                    showModal("Not Quite ❌", `Hint: ${q.exp || "Check the subject and verb agreement!"}`, "error");
                }
            };

            const q = data[currentQ];

            return (
                <div className={`flex-1 min-h-0 p-3 md:p-4 flex flex-col items-center justify-center overflow-hidden ${isFinal ? 'bg-gradient-to-b from-red-900 to-slate-900' : (world ? world.themeBg : 'bg-slate-800')}`}>
                    <div className="w-full max-w-2xl mb-2 flex justify-between items-center shrink-0">
                        <button type="button" onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_3px_0_#cbd5e1] px-3 py-1 text-xs">
                            ⬅️ Back
                        </button>
                        <div className="flex items-center gap-2">
                            {isFocusSynced && <span className="bg-emerald-500 text-white text-[10px] font-black px-2.5 py-0.5 rounded-full animate-pulse">📡 LIVE SYNC</span>}
                            <span className={`font-black text-xs sm:text-sm ${isFinal ? 'text-yellow-300' : 'text-slate-700'}`}>{currentQ + 1} / {data.length}</span>
                        </div>
                    </div>

                    <div className="game-card w-full max-w-2xl p-4 sm:p-5 animate-pop">
                        <div className="text-center mb-2">
                            <span className="text-2xl">{isFinal ? '👑' : '🔍'}</span>
                            <div className="text-[11px] font-black uppercase text-brand-purple">{title}</div>
                        </div>

                        {world && (
                            <div className="max-w-[200px] mx-auto mb-3">
                                <TopicIllustration topicId={world.id} className="w-full h-24 rounded-xl" />
                            </div>
                        )}

                        {liveAnswer && liveAnswer.qIndex === currentQ && (
                            <div className={`mb-3 p-2.5 rounded-xl border-2 text-center text-xs font-black animate-pop ${
                                liveAnswer.isCorrect ? 'bg-green-100 border-green-400 text-green-900' : 'bg-red-100 border-red-400 text-red-900'
                            }`}>
                                {liveAnswer.byAvatar} {liveAnswer.byName} menjawab {String.fromCharCode(65 + liveAnswer.optionIndex)} — {liveAnswer.isCorrect ? '✅ BENAR! Lanjut soal berikutnya...' : `❌ Belum tepat (${liveAnswer.exp})`}
                            </div>
                        )}

                        <h3 className="text-base sm:text-xl font-black text-slate-800 mb-4 text-center">{q.q}</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            {q.options.map((opt, i) => {
                                const isPicked = liveAnswer && liveAnswer.qIndex === currentQ && liveAnswer.optionIndex === i;
                                return (
                                    <button
                                        key={i}
                                        type="button"
                                        onClick={() => handleAnswer(i)}
                                        className={`w-full btn-3d py-2.5 text-left px-3.5 text-sm justify-start ${
                                            isPicked
                                                ? (liveAnswer.isCorrect ? 'btn-success ring-4 ring-green-400' : 'btn-danger ring-4 ring-red-400')
                                                : 'btn-secondary'
                                        }`}
                                    >
                                        <span className="bg-white/75 text-blue-900 w-6 h-6 rounded-full inline-flex items-center justify-center mr-2.5 font-black shrink-0 text-xs">
                                            {String.fromCharCode(65 + i)}
                                        </span>
                                        <span className="normal-case">{opt}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenSentenceBuilder = ({ world, onBack, onComplete, showModal, isFocusSynced, sharedSentenceState, onSyncSentence, actorInfo, onAwardPoint }) => {
            const data = world.sentences;
            const [localQ, setLocalQ] = useState(0);
            const [localSelectedIndices, setLocalSelectedIndices] = useState([]);

            const currentQ = (isFocusSynced && typeof sharedSentenceState?.currentQ === 'number')
                ? Math.min(sharedSentenceState.currentQ, data.length - 1)
                : localQ;

            // Deterministic shuffle per question so all screens share the exact same word tile order!
            const shuffledWords = useMemo(() => {
                const words = data[currentQ].words.map((w, i) => ({ w, origIdx: i }));
                return words.sort((a, b) => ((a.origIdx * 7 + currentQ * 3) % 11) - ((b.origIdx * 7 + currentQ * 3) % 11));
            }, [data, currentQ]);

            const selectedIndices = (isFocusSynced && Array.isArray(sharedSentenceState?.selectedIndices))
                ? sharedSentenceState.selectedIndices
                : localSelectedIndices;
            const liveFeedback = isFocusSynced ? sharedSentenceState?.feedback : null;

            useEffect(() => { setLocalQ(0); setLocalSelectedIndices([]); }, [world.id]);
            useEffect(() => { setLocalSelectedIndices([]); }, [localQ]);

            const updateSelection = (newIndices, feedback = null, nextQ = currentQ) => {
                if (isFocusSynced && onSyncSentence) {
                    onSyncSentence({
                        currentQ: nextQ,
                        selectedIndices: newIndices,
                        lastActor: `${actorInfo?.avatar || '🕵️‍♂️'} ${actorInfo?.name || 'Student'}`,
                        feedback
                    });
                } else {
                    setLocalSelectedIndices(newIndices);
                }
            };

            const handleSelectTile = (tileIdx) => {
                if (selectedIndices.includes(tileIdx)) return;
                updateSelection([...selectedIndices, tileIdx]);
            };

            const handleDeselectTile = (pos) => {
                updateSelection(selectedIndices.filter((_, i) => i !== pos));
            };

            const handleCheck = () => {
                const answer = selectedIndices.map(idx => shuffledWords[idx]?.w).join(" ");
                if (answer === data[currentQ].correct) {
                    if (isFocusSynced && onSyncSentence) {
                        if (onAwardPoint) onAwardPoint();
                        updateSelection(selectedIndices, { ok: true, text: `✅ ${actorInfo?.name} benar: "${answer}"` }, currentQ);
                        if (currentQ < data.length - 1) {
                            setTimeout(() => {
                                onSyncSentence({ currentQ: currentQ + 1, selectedIndices: [], feedback: null, lastActor: '' });
                            }, 1600);
                        }
                        return;
                    }
                    showModal("Amazing! ⭐", `Correct sentence:\n"${answer}"`, "success", () => {
                        if (localQ < data.length - 1) setLocalQ(q => q + 1);
                        else onComplete();
                    });
                } else {
                    if (isFocusSynced && onSyncSentence) {
                        updateSelection(selectedIndices, { ok: false, text: `❌ ${actorInfo?.name}: Urutan kata belum tepat, coba susun lagi!` }, currentQ);
                    } else {
                        showModal("Not Quite! 🚧", "Check the word order carefully and try again.", "error");
                    }
                }
            };

            const availableCount = shuffledWords.length - selectedIndices.length;

            return (
                <div className={`flex-1 min-h-0 p-3 md:p-4 ${world.themeBg} flex flex-col items-center justify-center overflow-hidden`}>
                    <div className="w-full max-w-3xl mb-2 flex justify-between items-center shrink-0">
                        <button type="button" onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_3px_0_#cbd5e1] px-3 py-1 text-xs">
                            ⬅️ Back
                        </button>
                        <div className="flex items-center gap-2">
                            {isFocusSynced && <span className="bg-emerald-500 text-white text-[10px] font-black px-2.5 py-0.5 rounded-full animate-pulse">📡 LIVE SYNC {sharedSentenceState?.lastActor ? `• ${sharedSentenceState.lastActor}` : ''}</span>}
                            <span className="font-black text-slate-600 text-xs sm:text-sm">Sentence {currentQ + 1} / {data.length}</span>
                        </div>
                    </div>

                    <div className="game-card w-full max-w-3xl p-4 sm:p-5 animate-pop">
                        <div className="text-center mb-2">
                            <span className={`inline-block text-[11px] font-black px-2.5 py-0.5 rounded-full border mb-1 ${world.badgeColor}`}>
                                🧩 Sentence Builder • {world.subjectTitle}
                            </span>
                            <h2 className="text-lg sm:text-2xl font-black text-brand-deep">Arrange the Words!</h2>
                        </div>

                        <div className="max-w-[200px] mx-auto mb-3">
                            <TopicIllustration topicId={world.id} className="w-full h-24 rounded-xl" />
                        </div>

                        {liveFeedback && (
                            <div className={`mb-3 p-2 rounded-xl border-2 text-center text-xs font-black ${
                                liveFeedback.ok ? 'bg-green-100 border-green-400 text-green-900' : 'bg-red-100 border-red-400 text-red-900'
                            }`}>
                                {liveFeedback.text}
                            </div>
                        )}

                        <div className="bg-slate-100 rounded-2xl min-h-[68px] p-3 flex flex-wrap gap-2 mb-4 border-4 border-dashed border-slate-300 items-center justify-center">
                            {selectedIndices.length === 0 && <span className="text-slate-400 font-bold text-xs">Tap words below to build a sentence...</span>}
                            {selectedIndices.map((tileIdx, pos) => (
                                <button key={`sel-${pos}`} type="button" onClick={() => handleDeselectTile(pos)}
                                    className="bg-brand-yellow text-yellow-950 font-black px-3 py-1 rounded-xl shadow-[0_3px_0_#ca8a04] hover:bg-yellow-300 text-sm">
                                    {shuffledWords[tileIdx]?.w}
                                </button>
                            ))}
                        </div>

                        <div className="flex flex-wrap gap-2 justify-center mb-4">
                            {shuffledWords.map((item, tileIdx) => {
                                if (selectedIndices.includes(tileIdx)) return null;
                                return (
                                    <button key={`avail-${tileIdx}`} type="button" onClick={() => handleSelectTile(tileIdx)}

            const updateWriting = (nextText, nextUsed) => {
                if (isFocusSynced && onSyncWriting) {

                        text: nextText,
                        usedIds: nextUsed,
                        lastEditor: `${actorInfo?.avatar || '🕵️‍♂️'} ${actorInfo?.name || 'Student'}`

                    showModal("Kode Host Tidak Valid ❌", "Masukkan Kode Host yang diberikan oleh Guru Utama (contoh: HOST-AB12CD).", "error");
                    return;
                }
                const existing = await window.FB_BRIDGE.fetchRoom(targetRoom);
                const tName = hostInputName.trim() || 'Guru Co-Host';
                const currentCo = existing?.coTeachers || [];
                const already = currentCo.some(t => t.uid === window.FB_BRIDGE.uid);
                const updatedCo = already ? currentCo : [...currentCo, { uid: window.FB_BRIDGE.uid, name: tName, role: 'Co-Host', joinedAt: Date.now() }];

                await window.FB_BRIDGE.upsertRoom(targetRoom, {
                    roomCode: targetRoom,
                    hostCode: existing?.hostCode || makeHostCode(targetRoom),
                    coTeachers: updatedCo
                });
                onHostRoom(targetRoom, tName);
                setJoinHostCode('');
                showModal("Berhasil Bergabung sebagai Guru Co-Host! 👩‍🏫", `Anda (${tName}) kini terhubung di Room ${targetRoom} dan dapat mengontrol Mode Fokus, Walkie-Talkie, serta Tugas Bersama.`, "success");
            };

            const toggleFocusMode = async () => {
                if (!roomCode) return;
                const nextState = !roomData?.focusMode;
                await window.FB_BRIDGE.upsertRoom(roomCode, {
                    focusMode: nextState,
                    focusTitle,
                    focusMessage: focusMsg,
                    focusScreen: nextState ? 'dashboard' : null,
                    focusUpdatedAt: Date.now()
                });
            };

            const openAllMenusInFocusMode = async () => {
                if (!roomCode) return;
                await window.FB_BRIDGE.upsertRoom(roomCode, {
                    focusMode: true,
                    focusTitle,
                    focusMessage: focusMsg,
                    focusScreen: 'map',
                    focusUpdatedAt: Date.now()
                });
                onOpenTeacherMenu('map');
            };

            const launchSharedDragDrop = async () => {
                if (!roomCode) return;
                await window.FB_BRIDGE.upsertRoom(roomCode, {
                    focusMode: false,
                    sharedTask: {
                        active: true,
                        worldId: sharedWorld,
                        startedAt: Date.now(),
                        assignments: {}
                    }
                });
                onOpenSharedTask();
            };

            const stopSharedDragDrop = async () => {
                if (!roomCode) return;
                await window.FB_BRIDGE.upsertRoom(roomCode, {
                    sharedTask: { active: false, worldId: sharedWorld, assignments: {} }
                });
            };

            const sortedPlayers = [...roomPlayers].sort((a, b) => (b.points || 0) - (a.points || 0));
            const currentHostCode = roomData?.hostCode || (roomCode ? makeHostCode(roomCode) : '');
            const coTeachers = roomData?.coTeachers || [];

            return (
                <div className="flex-1 min-h-0 p-2.5 sm:p-4 pt-12 sm:pt-11 bg-slate-100 flex flex-col h-full overflow-hidden">
                    {/* Top Bar */}
                    <div className="flex flex-wrap justify-between items-center gap-2 mb-2.5 shrink-0">
                        <div>
                            <h2 className="text-lg sm:text-xl font-black text-brand-deep">👩‍🏫 Teacher Dashboard & Multiplayer Host</h2>
                            <p className="text-[11px] font-bold text-slate-500">Kelola Room Murid, Kode Host Guru Lain, Mode Fokus & Walkie-Talkie</p>
                        </div>
                        <div className="flex flex-wrap items-center gap-2">
                            {roomCode && (
                                <WalkieTalkieControl
                                    roomCode={roomCode}
                                    senderName={teacherName}
                                    senderAvatar="👩‍🏫"
                                    isTeacher={true}
                                    voiceMuted={voiceMuted}
                                    onToggleMute={onToggleMute}
                                    activeSpeaker={activeSpeaker}
                                    showModal={showModal}
                                />
                            )}
                            <button type="button" onClick={onBack} className="btn-3d bg-slate-300 text-slate-800 border-2 border-slate-400 shadow-[0_3px_0_#94a3b8] px-3 py-1 text-xs">
                                ⬅️ Home
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-3 flex-1 min-h-0 overflow-hidden">
                        {/* Left Column: Host Room & Join as Co-Host Menu */}
                        <div className="lg:col-span-5 flex flex-col gap-2.5 min-h-0 overflow-hidden">
                            {/* Teacher Identity & Create/Active Room Card */}
                            <div className="bg-white rounded-2xl p-3 border-2 border-slate-200 shadow-sm space-y-2 shrink-0">
                                <div className="flex items-center justify-between">
                                    <h3 className="font-black text-brand-deep text-sm">🏫 Kontrol Room Guru</h3>
                                    {roomCode && <span className="bg-green-100 text-green-700 text-[10px] font-black px-2 py-0.5 rounded-full">🟢 LIVE</span>}
                                </div>

                                <input
                                    type="text"
                                    value={hostInputName}
                                    onChange={e => { setHostInputName(e.target.value); setTeacherName(e.target.value); }}
                                    className="w-full bg-slate-50 border-2 border-slate-300 rounded-xl px-2.5 py-1.5 text-xs font-bold focus:border-brand-sky focus:outline-none"
                                    placeholder="Nama Guru / Co-Host (Contoh: Ibu Venny)"
                                />

                                {!roomCode ? (
                                    <button type="button" onClick={handleCreateRoom} className="w-full btn-3d btn-primary py-2.5 text-xs">
                                        🚀 BUAT ROOM MULTIPLAYER BARU
                                    </button>
                                ) : (
                                    <div className="grid grid-cols-2 gap-2">
                                        {/* Kode Bergabung Murid */}
                                        <div className="bg-blue-50 border-2 border-blue-300 rounded-xl p-2 flex items-center justify-between gap-1">
                                            <div className="min-w-0">
                                                <div className="text-[9px] font-black text-blue-700 uppercase">Kode Murid</div>
                                                <div className="text-base font-black tracking-wider text-brand-deep">{roomCode}</div>
                                            </div>
                                            <button
                                                type="button"
                                                onClick={() => { copyTextSafe(roomCode); showModal("Disalin! 📋", `Kode Murid (${roomCode}) siap dibagikan.`, "success"); }}
                                                className="btn-3d btn-secondary px-2 py-1 text-[10px]"
                                            >
                                                📋
                                            </button>
                                        </div>

                                        {/* Kode Host untuk Guru Lain */}
                                        <div className="bg-purple-50 border-2 border-purple-300 rounded-xl p-2 flex items-center justify-between gap-1">
                                            <div className="min-w-0">
                                                <div className="text-[9px] font-black text-purple-700 uppercase">🔑 Kode Host</div>
                                                <div className="text-xs font-black tracking-wide text-purple-900 truncate">{currentHostCode}</div>
                                            </div>
                                            <button
                                                type="button"
                                                onClick={() => { copyTextSafe(currentHostCode); showModal("Kode Host Disalin! 🔑", `Bagikan Kode Host (${currentHostCode}) ke guru lain.`, "success"); }}
                                                className="btn-3d btn-purple px-2 py-1 text-[10px]"
                                            >
                                                📋
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* MENU KODE HOST: Gabung sebagai Guru Lain (Co-Host) */}
                            <form onSubmit={handleJoinAsCoHost} className="bg-gradient-to-br from-indigo-50 to-purple-50 rounded-2xl p-3 border-2 border-purple-300 shadow-sm space-y-1.5 shrink-0">
                                <h3 className="font-black text-purple-900 text-xs flex items-center gap-1">
                                    <span>🔑</span> Menu Kode Host (Gabung Guru Lain / Co-Host)
                                </h3>
                                <div className="flex gap-1.5">
                                    <input
                                        type="text"
                                        value={joinHostCode}
                                        onChange={e => setJoinHostCode(e.target.value.toUpperCase())}
                                        placeholder="HOST-AB12CD"
                                        className="flex-1 bg-white border-2 border-purple-300 rounded-xl px-2.5 py-1.5 text-xs font-black uppercase tracking-wider text-purple-950 focus:border-purple-500 focus:outline-none"
                                    />
                                    <button type="submit" className="btn-3d btn-purple px-3 py-1.5 text-[11px] shrink-0">
                                        🤝 Gabung
                                    </button>
                                </div>
                            </form>

                            {/* Mode Fokus & Live Shared Drag & Drop Controls */}
                            {roomCode && (
                                <div className="bg-white rounded-2xl p-3 border-2 border-slate-200 shadow-sm space-y-2 flex-1 min-h-0 overflow-hidden flex flex-col justify-between">
                                    <div className="space-y-1.5 bg-amber-50 p-2.5 rounded-xl border border-amber-200">
                                        <div className="text-[11px] font-black text-amber-900">🎛️ Kontrol Mode Fokus (Sinkron Jawaban Real-Time)</div>
                                        <input type="text" value={focusTitle} onChange={e => setFocusTitle(e.target.value)}
                                            className="w-full bg-white border border-amber-300 rounded-lg px-2 py-1 text-[11px] font-black" placeholder="Judul Mode Fokus" />
                                        <div className="grid grid-cols-2 gap-1.5">
                                            <button
                                                type="button"
                                                onClick={toggleFocusMode}
                                                className={`btn-3d py-1.5 text-[10px] ${roomData?.focusMode ? 'btn-danger' : 'btn-primary'}`}
                                            >
                                                {roomData?.focusMode ? '🔓 FOKUS OFF' : '🔒 FOKUS ON'}
                                            </button>
                                            <button
                                                type="button"
                                                onClick={openAllMenusInFocusMode}
                                                className="btn-3d btn-secondary py-1.5 text-[10px]"
                                            >
                                                🎮 BUKA MENU GAME
                                            </button>
                                        </div>
                                    </div>

                                    <div className="space-y-1.5 bg-cyan-50 p-2.5 rounded-xl border border-cyan-200">
                                        <div className="text-[11px] font-black text-cyan-900">🧲 Tugas Drag & Drop Live (Terlihat Semua Orang)</div>
                                        <div className="flex gap-1.5">
                                            <select
                                                value={sharedWorld}
                                                onChange={e => setSharedWorld(e.target.value)}
                                                className="flex-1 bg-white border-2 border-cyan-300 rounded-xl px-2 py-1 text-[11px] font-bold"
                                            >
                                                {Object.values(WORLDS_DATA).map(w => (
                                                    <option key={w.id} value={w.id}>{w.icon} {w.name}</option>
                                                ))}
                                            </select>
                                            <button type="button" onClick={launchSharedDragDrop} className="btn-3d btn-success px-3 py-1 text-[10px]">
                                                ▶ Mulai
                                            </button>
                                            {roomData?.sharedTask?.active && (
                                                <button type="button" onClick={stopSharedDragDrop} className="btn-3d btn-danger px-2.5 py-1 text-[10px]">⏹</button>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Right Column: Live Leaderboard */}
                        <div className="lg:col-span-7 flex flex-col gap-2.5 min-h-0 overflow-hidden">
                            <div className="bg-white rounded-2xl p-3.5 border-2 border-slate-200 shadow-sm flex-1 min-h-0 flex flex-col overflow-hidden">
                                <div className="flex justify-between items-center mb-2 shrink-0">
                                    <h3 className="font-black text-brand-deep text-sm sm:text-base">🏆 Live Leaderboard Murid ({sortedPlayers.length})</h3>
                                    <div className="flex items-center gap-1.5">
                                        {coTeachers.length > 0 && (
                                            <span className="bg-purple-100 text-purple-800 text-[10px] font-black px-2 py-0.5 rounded-full">
                                                👩‍🏫 {coTeachers.length} Guru
                                            </span>
                                        )}
                                        {roomData?.certificateWinner && (
                                            <span className="bg-yellow-100 text-yellow-900 text-[10px] font-black px-2 py-0.5 rounded-full border border-yellow-300">
                                                👑 {roomData.certificateWinner.name}
                                            </span>
                                        )}
                                    </div>
                                </div>

                                {sortedPlayers.length === 0 ? (
                                    <div className="flex-1 flex items-center justify-center text-slate-400 font-bold text-xs sm:text-sm text-center">
                                        {roomCode ? `Menunggu murid bergabung ke Room ${roomCode}...` : "Buat Room atau gabung dengan Kode Host untuk melihat murid secara real-time."}
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 flex-1 content-start overflow-hidden">
                                        {sortedPlayers.map((p, idx) => (
                                            <div key={p.uid} className="flex items-center justify-between p-2.5 rounded-xl border-2 border-slate-100 bg-slate-50">
                                                <div className="flex items-center gap-2 min-w-0">
                                                    <span className="font-black text-brand-deep w-5 text-xs">#{idx + 1}</span>
                                                    <span className="text-xl">{p.avatar || '🕵️‍♂️'}</span>
                                                    <div className="min-w-0">
                                                        <div className="font-black text-slate-800 text-xs sm:text-sm truncate">{p.name}</div>
                                                        <div className="text-[10px] font-bold text-slate-500">Class {p.class || 'VII'} • Lv.{calcLevel(p.points)}</div>
                                                    </div>
                                                </div>
                                                <span className="bg-brand-yellow text-yellow-950 font-black px-2.5 py-0.5 rounded-full text-[11px] shrink-0">
                                                    {p.points || 0} Pts
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Floating Chat for Teachers when inside Dashboard */}
                    {roomCode && (
                        <FloatingMultiplayerPanels
                            roomCode={roomCode}
                            players={roomPlayers}
                            messages={roomMessages}
                            myUid={window.FB_BRIDGE?.uid}
                            senderName={teacherName}
                            senderAvatar="👩‍🏫"
                            isTeacher={true}
                        />
                    )}
                </div>
            );
        };

        // --- RENDER ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
